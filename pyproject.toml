[project]
name = "scheda"
version = "0.4.2"
description = "Testdata driver for the scheda CLI and locked vLLM HTTP embedder/reranker sidecars. Not a language binding."
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
# Extra pins: uv's latest of these was <2 days old (2026-08-26). Do not use
# [tool.uv] constraint-dependencies — that writes [manifest] constraints and
# aspect_rules_py fails to parse the lock.
dependencies = ["vllm==0.28.0", "huggingface-hub==1.29.0"]

[tool.uv]
package = false
# vLLM publishes manylinux wheels only. macOS CI keeps `//python` for ruff /
# pip-audit and deletes `python/cli` and `python/vllm` in `.bazelrc`.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.ruff]
target-version = "py314"
src = ["python"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001"]

[tool.ruff.lint.isort]
known-first-party = ["python"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"python/__init__.py" = ["D104"]
"python/cli/__init__.py" = ["D104"]
"python/cli/__main__.py" = ["D104"]
"python/cli/main.py" = ["ANN401", "S310", "S404"]
"python/vllm/__init__.py" = ["D104"]

[tool.ruff.format]
docstring-code-format = true
