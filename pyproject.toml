[project]
name = "scheda"
version = "0.25.0"
description = "Testdata driver for the scheda CLI and locked vLLM HTTP embedder/reranker sidecars. Not a language binding."
requires-python = ">=3.14,<3.15"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
# Extra pins: the newest versions at least 2 days old (2026-10-19), but
# vllm 0.32.0, taken a day early on the owner's word (it fixes
# PYSEC-2026-4319; its files match the GitHub release). certifi 2026.10.19
# (in the lock only) taken a day early on the owner's word (20 October
# 2026): it drops the emSign roots (GHSA-6q48-6c7w-9gw2), and its files
# carry the GitHub publishing attestation of certifi/python-certifi.
# huggingface-hub 2.x
# needs vLLM 0.32.0 or later (its transformers allows <3.0). Do not use
# [tool.uv] constraint-dependencies — that writes [manifest] constraints and
# aspect_rules_py fails to parse the lock.
dependencies = ["vllm==0.32.0", "huggingface-hub==2.2.0"]

[tool.uv]
package = false
# vLLM publishes manylinux wheels only. macOS CI keeps `//python` for ruff /
# uv audit and deletes `python/cli` and `python/vllm` in `.bazelrc`.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.ruff]
target-version = "py314"
src = ["python"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001"]

[tool.ruff.lint.isort]
known-first-party = ["python"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"python/__init__.py" = ["D104"]
"python/cli/__init__.py" = ["D104"]
"python/cli/__main__.py" = ["D104"]
"python/cli/main.py" = ["ANN401", "S310", "S404"]
"python/vllm/__init__.py" = ["D104"]

[tool.ruff.format]
docstring-code-format = true
