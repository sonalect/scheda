// The Vault: one open Vault, and what it holds besides its collections'
// Documents.

edition = "2024";

package scheda.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "protocontract/v1/options.proto";
import "scheda/v1/collection.proto";
import "scheda/v1/document.proto";
import "scheda/v1/error.proto";
import "scheda/v1/index.proto";
import "scheda/v1/mirror.proto";
import "scheda/v1/ports.proto";
import "scheda/v1/query.proto";

// One open Vault: its collections, its ports, and the writes and reads
// that cross collections. A `Collection` reads and writes the Documents of
// one; the `Mirror` and the `Index` are parts of the Vault with objects of
// their own.
//
// A write returns when it is stored, and only then: a call that returns
// `Ok` happened, a call that fails wrote nothing. Writes from every Vault
// object and every process on one Vault are applied one after another, in
// the order they were made; no write fails because another one is running.
// Reads see stored state only. The Index follows the stored state in the
// background: queries and searches answer from what it holds, and
// `Index.Watch` tells how far it is.
//
// After `Close`, every call of this Vault and of every object reached from
// it fails with `FAILED_PRECONDITION`. A Vault whose references are all
// dropped closes as `Close` would, without the report.
service Vault {
  // The Vault.

  // What this Vault holds: its path, the Index path, and the writer
  // identity of this clone. Reads no Document.
  rpc Info(google.protobuf.Empty) returns (VaultInfo);

  // Checks the whole Vault, file by file, and lists every problem it
  // finds: collection declarations, journal lines, duplicate ids, an
  // unfinished merge (from git's own state, not from the bytes of a file),
  // the gitignore of isolated collections, and the owner-only modes under
  // `{vault}/.scheda/`. It fails only when it cannot run; what it finds is
  // the report.
  rpc Check(google.protobuf.Empty) returns (CheckReport);

  // Ends the Vault: new calls fail at once; it returns when the calls that
  // run have ended, the indexer has stopped, and the Vault holds no lock.
  // A second `Close` is nothing to do.
  rpc Close(google.protobuf.Empty) returns (google.protobuf.Empty);

  // Its parts.

  // The mirror of the Vault, set or not: `Mirror.Info` says which.
  rpc Mirror(google.protobuf.Empty) returns (MirrorRef);

  // The Index of the Vault. A build without `find`, `UNIMPLEMENTED`.
  rpc Index(google.protobuf.Empty) returns (IndexRef);

  // Ports. A port is the Vault's until it is removed or replaced, and may
  // change at any time: the indexer takes the new set into its next round
  // (who indexes depends on the ports a Vault holds). A port of a feature
  // this build lacks, `UNIMPLEMENTED`; an async port outside a tokio
  // runtime, `INVALID_ARGUMENT`.

  // Gives the Vault this Projector, in place of the one it had. Its
  // `Describe` is read here, once.
  rpc SetProjector(ProjectorRef) returns (google.protobuf.Empty);

  // Takes the Projector away. Without one, nothing to do.
  rpc RemoveProjector(google.protobuf.Empty) returns (google.protobuf.Empty);

  // Gives the Vault this embedder, in place of the one it had. Its
  // `Describe` is read here, once.
  rpc SetEmbedder(EmbedderRef) returns (google.protobuf.Empty);

  // Takes the embedder away. Without one, nothing to do.
  rpc RemoveEmbedder(google.protobuf.Empty) returns (google.protobuf.Empty);

  // Gives the Vault this reranker, in place of the one it had.
  rpc SetReranker(RerankerRef) returns (google.protobuf.Empty);

  // Takes the reranker away. Without one, nothing to do.
  rpc RemoveReranker(google.protobuf.Empty) returns (google.protobuf.Empty);

  // Collections: the set of them and their declarations.

  // Every declared collection, isolated ones included, in name order.
  rpc ListCollections(google.protobuf.Empty) returns (Collections);

  // One collection, to read and write its Documents. Unknown, `NOT_FOUND`.
  // The object names the collection; each of its calls finds it again, so
  // after the collection is deleted they are `NOT_FOUND`, and after it is
  // declared again they work again.
  rpc GetCollection(CollectionKey) returns (CollectionRef);

  // Declares a collection and returns the declaration as stored, defaults
  // filled in. An existing name, `ALREADY_EXISTS`. An isolated collection
  // gets its place under `{vault}/.isolated/`.
  rpc CreateCollection(CollectionDeclaration) returns (CollectionDeclaration);

  // Changes the schema of an existing collection and returns the
  // declaration as stored. Unknown, `NOT_FOUND`. The kind and `isolated`
  // change only while the collection holds no Document, and `encrypted`
  // only then too; otherwise `FAILED_PRECONDITION`.
  rpc UpdateCollection(CollectionDeclaration) returns (CollectionDeclaration);

  // Deletes an empty collection: its declaration and its directory.
  // Holding Documents, `FAILED_PRECONDITION`: they are deleted first.
  // Unknown, `NOT_FOUND`, or nothing with `ignore_missing`. The name can
  // be declared again afterwards.
  rpc DeleteCollection(CollectionDeletion) returns (google.protobuf.Empty);

  // Several collection writes as one: all happen, or none. An `Err` item,
  // a broken stream, or one write that fails, and none happened; the error
  // names the operation by its index. One result per operation, in order.
  rpc BatchCollections(stream CollectionOperation) returns (CollectionBatchResult);

  // Documents across collections.

  // Several Document writes as one, across collections: all happen, or
  // none, as `Collection.Batch` within one. A batch does not mix isolated
  // collections with the others (`INVALID_ARGUMENT`): they are two
  // repositories. Collections are not written here (`BatchCollections`).
  rpc BatchDocuments(stream VaultDocumentOperation) returns (DocumentBatchResult);

  // The Documents of several collections that match a condition, as
  // `Collection.Query` within one; a leaf on a Projector column names its
  // collection.
  rpc QueryDocuments(VaultQuery) returns (stream Document);

  // How many Documents `QueryDocuments` would give for the same query. The
  // codes of `QueryDocuments`.
  rpc CountDocuments(VaultQuery) returns (Count);

  // The Documents of several collections that best fit a text, or a
  // Document, as `Collection.Search` within one.
  rpc SearchDocuments(VaultSearch) returns (stream SearchItem);
}

// A reference to an open Vault.
message VaultRef {
  option (protocontract.v1.service) = "scheda.v1.Vault";
}

// What `Vault.Info` reports. Output only.
message VaultInfo {
  // The Vault root it was opened at. Not a Document path.
  string path = 1;
  // The Index directory, `{vault}/.scheda/index`. Not a caller option.
  string index_path = 2;
  // The machine-local identity of this clone, as `OpenOptions.writer` or
  // as generated into `{vault}/.scheda/writer`.
  string writer = 3;
}

// One item of `Vault.BatchDocuments`: a Document write in one collection.
message VaultDocumentOperation {
  // The collection the write is in.
  string collection = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
  // The write, as `Collection.Batch` takes it.
  DocumentOperation operation = 2 [(buf.validate.field) = {required: true}];
}

// What `Check` found. Output only. Empty when the Vault is sound.
message CheckReport {
  repeated Problem problems = 1;
}

// One problem `Check` found.
message Problem {
  // The class of the problem, as a failure of a call would carry it.
  VaultErrorCode code = 1;
  // The file it is about, relative to the Vault root (POSIX). Unset when
  // it is about no one file.
  string path = 2;
  // What is wrong, for a person.
  string message = 3;
}
