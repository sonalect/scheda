// The failures of the Vault, and their form for a transport.

edition = "2024";

package scheda.v1;

// The failures of `Vault` a caller may branch on. A code says what the
// caller can do about it; the cause (an I/O error, a git message, an
// error of the Index) travels as the source of the error, so nothing of
// it is lost. The names follow the gRPC canonical codes where the meaning
// is the same.
enum VaultErrorCode {
  VAULT_ERROR_CODE_UNSPECIFIED = 0;
  // The request breaks a rule of this contract. Fix the request.
  VAULT_ERROR_CODE_INVALID_ARGUMENT = 1;
  // The collection, Document, or mirror is not there.
  VAULT_ERROR_CODE_NOT_FOUND = 2;
  // A collection or Document of that name is already there.
  VAULT_ERROR_CODE_ALREADY_EXISTS = 3;
  // The stored state is not the one the request requires: another
  // revision, a collection that still holds Documents. Read again.
  VAULT_ERROR_CODE_FAILED_PRECONDITION = 4;
  // The call does not apply (a journal line is not replaced) or this
  // build lacks the feature it needs.
  VAULT_ERROR_CODE_UNIMPLEMENTED = 5;
  // Another write held the write lock for the whole write timeout, or
  // `HEAD` moved under the write (a `git` command run by hand). Retryable;
  // nothing was written.
  VAULT_ERROR_CODE_ABORTED = 6;
  // Something the call needs cannot be reached now: the mirror or a port.
  // Retryable.
  VAULT_ERROR_CODE_UNAVAILABLE = 7;
  // The mirror refused the credentials git gave it.
  VAULT_ERROR_CODE_UNAUTHENTICATED = 8;
  // The path holds no Vault.
  VAULT_ERROR_CODE_NOT_A_VAULT = 9;
  // The Vault is of another generation than this build reads.
  VAULT_ERROR_CODE_GENERATION = 10;
  // The secret of an encrypted collection is missing or wrong, or its
  // bytes do not decrypt.
  VAULT_ERROR_CODE_CRYPTO = 11;
  // The mirror holds writes this Vault has not pulled. Pull, then try
  // again.
  VAULT_ERROR_CODE_MIRROR_AHEAD = 12;
  // The writes of the mirror cannot be joined with this Vault's.
  VAULT_ERROR_CODE_MIRROR_CONFLICT = 13;
  // A file holds an unfinished merge. Resolve it by hand.
  VAULT_ERROR_CODE_UNRESOLVED_CONFLICT = 14;
  // The Index has not been built yet: its first build runs, and there is
  // no Index to answer from (a new Vault, or an Index of an earlier version
  // of Scheda, removed). Retryable soon; `Index.Watch` says when. A rebuild
  // of a built Index never gives it.
  VAULT_ERROR_CODE_INDEX_REBUILDING = 15;
  // The Index was built by a Projector of another projection, with other
  // columns, or with an embedder of another model or vector length, than
  // this Vault's. The Vault does not index, and its queries and searches
  // fail with this code, until an `Index.Reindex` of a Vault with these
  // ports has switched the Index to them.
  VAULT_ERROR_CODE_INDEX_STALE = 16;
  // The Index is damaged. `Index.Reindex`.
  VAULT_ERROR_CODE_INDEX_BROKEN = 17;
  // The storage below the Vault failed. Retryable when the failure is a
  // passing one (interrupted, would block, busy).
  VAULT_ERROR_CODE_STORAGE = 18;
  // Exchanging writes with the mirror failed otherwise, or git failed in a
  // way no other code names.
  VAULT_ERROR_CODE_REPLICATION = 19;
  // A query, a count, or a search with `not_before`: the Index did not
  // reach that state within `OpenOptions.index_wait_timeout_ms`. Retryable;
  // `Index.Status` says where the Index stands.
  VAULT_ERROR_CODE_DEADLINE_EXCEEDED = 20;
  // The Vault's own git data is missing or damaged: an object, a tree, a
  // reference, a configuration, or a repository the stored state needs is
  // not there or does not read. Not the disk (`STORAGE`) and not the mirror
  // (`REPLICATION`). Restore the Vault from its mirror or a copy.
  VAULT_ERROR_CODE_DATA_LOSS = 21;
}

// A failure, as a transport (the CLI, a status) carries it. The library
// returns its own error type; this is that error written out.
message ErrorReport {
  // The name of the code: `VAULT_ERROR_CODE_NOT_FOUND`, or the code of a
  // port or of the runtime.
  string code = 1;
  // What happened, for a person. Never replaces the code.
  string message = 2;
  // Whether the same call may succeed later.
  bool retryable = 3;
  // The operations the failure passed on its way out, outermost first.
  repeated string stack = 4;
  // The file it is about, relative to the Vault root (POSIX). Unset when
  // it is about no one file.
  string path = 5;
}
