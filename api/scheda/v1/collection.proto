// Collections: the object of one collection, its declaration, and the
// requests that write declarations.
//
// `CollectionDeclaration`, `Schema`, `Standard`, `Journal`, `Singleton`,
// and `Unit` are also stored on disk, as the Protobuf JSON (or YAML) of the file
// `{vault}/{name}/.collection.yaml` (also `.yml` / `.json`). A file keeps
// field names, not message names. An earlier Scheda reads past a field it
// does not know and keeps it when it rewrites the file; a change it could
// not safely ignore (a field removed, renamed, or given another meaning)
// changes the generation in `VaultMarker`. Optional fields are left out of
// the file when unset.

edition = "2024";

package scheda.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "protocontract/v1/options.proto";
import "scheda/v1/document.proto";
import "scheda/v1/query.proto";

// One collection of a Vault, from `Vault.GetCollection`: its Documents,
// read and written. It names its collection: every call finds it again,
// so after the collection is deleted the calls are `NOT_FOUND`. The
// declaration itself changes through the Vault (`Vault.UpdateCollection`).
//
// The semantics of writes, reads, and the Index are the Vault's.
service Collection {
  // The declaration, as stored.
  rpc Describe(google.protobuf.Empty) returns (CollectionDeclaration);

  // Reads.

  // One Document, read from its file, not from the Index. Unknown,
  // `NOT_FOUND`.
  rpc Get(DocumentId) returns (Document);

  // Many Documents: the given ids, or the collection page by page. A lazy
  // stream: each Document is read when the stream reaches it. Needs no
  // Index.
  rpc GetMany(DocumentSelection) returns (stream Document);

  // The past versions of one Document, newest first. A lazy stream: a
  // version is read when the stream reaches it; the caller stops when it
  // has enough. A journal line never changes, so a journal is
  // `UNIMPLEMENTED`.
  rpc History(DocumentId) returns (stream DocumentHistoryEntry);

  // Writes.

  // Creates a Document and returns it as stored, with its revision, and
  // the state token of the write. In a journal, appends a line. Present,
  // `ALREADY_EXISTS`, or, with `keep_existing`, the Document already stored
  // is returned and nothing is written.
  rpc Create(DocumentCreation) returns (DocumentWriteResult);

  // Replaces an existing Document and returns it as stored, and the state
  // token of the write. Absent, `NOT_FOUND`. With `revision`, the stored
  // revision must be that one, or `FAILED_PRECONDITION`. A journal,
  // `UNIMPLEMENTED`. The same bytes store nothing and keep the revision.
  rpc Update(DocumentUpdate) returns (DocumentWriteResult);

  // Creates the Document, or replaces it when present, and returns it as
  // stored, and the state token of the write. A journal, `UNIMPLEMENTED`.
  // The same bytes store nothing and keep the revision.
  rpc Upsert(DocumentUpsert) returns (DocumentWriteResult);

  // Deletes a Document and returns the state token of the write, with no
  // `document`. Absent, `NOT_FOUND`, or nothing with `ignore_missing`. With
  // `revision`, the stored revision must be that one, or
  // `FAILED_PRECONDITION`. A journal, `UNIMPLEMENTED`: a journal line never
  // leaves.
  rpc Delete(DocumentDeletion) returns (DocumentWriteResult);

  // Several Document writes as one: all happen, or none. An `Err` item, a
  // broken stream, or one write that fails, and none happened; the error
  // names the operation by its index. One result per operation, in order.
  // Across collections, `Vault.BatchDocuments`.
  rpc Batch(stream DocumentOperation) returns (DocumentBatchResult);

  // The Index.

  // The Documents that match a filter (`DocumentQuery.filter`): the
  // exact set, in the order of the query (by default `id`; a journal in
  // append order), without scores. The first item is a summary, with how
  // many Documents match; then the Documents of the page. With
  // `not_before`, it first waits for the Index to reach that state. The
  // total and the keys of the page come from one snapshot of the Index,
  // taken when the call starts, so nothing written meanwhile moves them;
  // the Documents are read as the stream reaches them. An Index never
  // built, `INDEX_REBUILDING`; one built for another Projector or embedder
  // than this Vault's, `INDEX_STALE`. A build without `index`,
  // `UNIMPLEMENTED`.
  rpc Query(DocumentQuery) returns (stream QueryItem);

  // How many Documents the filter matches: the `QuerySummary.total` of
  // `Query` for the same query, counted in the Index without opening a
  // file. The codes of `Query`.
  rpc Count(DocumentQuery) returns (scheda.v1.Count);

  // The Documents that best fit a text, or a Document, by relevance: a
  // lexical leg, a vector leg, both fused, and reranked by the Vault's
  // reranker when `rerank_limit` asks. The first item is a summary of the
  // legs; then the hits, best first. A lazy stream: the ranking is
  // computed whole, the Documents are read as the stream reaches them. A
  // ranking is computed again by each call, so pages from two calls need
  // not agree. With `not_before`, it first waits for the Index to reach
  // that state. An Index never built, `INDEX_REBUILDING`; one built for
  // another Projector or embedder than this Vault's, `INDEX_STALE`. A build
  // without `index`, `UNIMPLEMENTED`.
  rpc Search(DocumentSearch) returns (stream SearchItem);

  // The vectors the Index holds in one `vector` column for the given
  // Documents, as they were stored, with the digest of the text each was
  // made from: one item per vector, in the order of the ids, a `text list`
  // in the order of its texts, and one `absent` item for an id that has
  // none. No model is called. A lazy stream: the vectors are read in
  // portions of a few Documents as the stream reaches them, so its memory
  // does not grow with the ids. It reads one snapshot of the Index, taken
  // when the call starts, for one hour: an item asked later is
  // `FAILED_PRECONDITION` (ask again for the ids not given yet). With
  // `not_before`, it first waits for the Index to reach that state. A
  // column the Projector does not mark `vector` for the collection,
  // `INVALID_ARGUMENT`; a collection whose `index_scope` keeps no vectors,
  // or an encrypted one, `UNIMPLEMENTED`. The Index codes of `Query`.
  rpc GetVectors(VectorSelection) returns (stream VectorItem);
}

// A reference to one collection of a Vault.
message CollectionRef {
  option (protocontract.v1.service) = "scheda.v1.Collection";
}

// A declared collection: the file `{vault}/{name}/.collection.yaml`. The
// declaration holds no field and no format of the Documents: Scheda does
// not know what they hold.
message CollectionDeclaration {
  // The collection name and its directory. Unique in the Vault. A slug,
  // checked by the library: a Unicode letter or digit, then letters,
  // digits, marks, `.`, `_`, `-`, `+`, `(`, `)`, space, or `@`; at most
  // 255 bytes.
  string name = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
  // The kind and the perimeter of the collection.
  Schema schema = 2 [(buf.validate.field) = {required: true}];
}

// What the Index holds of the Documents of a collection.
enum IndexScope {
  // As `INDEX_SCOPE_ALL`.
  INDEX_SCOPE_UNSPECIFIED = 0;
  // Identity, the values of the Projector's columns, and the vectors of
  // its `vector` columns.
  INDEX_SCOPE_ALL = 1;
  // Identity and the values; no vector: the embedder is never called for
  // the collection, and a search ranks it by the lexical leg only.
  INDEX_SCOPE_NO_VECTORS = 2;
  // Identity only: its Documents are listed and counted by id. A query or
  // count of it that filters or orders, and a search of it, is
  // `UNIMPLEMENTED`, not answered empty. The journal id map is still kept.
  INDEX_SCOPE_IDS = 3;
}

// The kind of a collection and how its Documents are kept.
message Schema {
  option (buf.validate.message).cel = {
    id: "schema.encrypted_journal"
    message: "a journal cannot be encrypted: a sealed file cannot be appended to"
    expression: "!this.encrypted || !has(this.journal)"
  };
  // Exactly one kind; the arm that is set is the kind.
  oneof kind {
    option (buf.validate.oneof).required = true;
    // A Document per file, `{name}/{id}`, which can be replaced and
    // deleted.
    Standard standard = 1;
    // Documents appended as lines to segment files; never replaced,
    // never deleted.
    Journal journal = 2;
    // One Document, `{name}/{id}`, with the `id` declared here.
    Singleton singleton = 3;
  }
  // Documents live under `{vault}/.isolated/{name}/`, a git repository of
  // their own that never leaves the machine: for what may be lost or
  // rebuilt. What is private and must survive belongs in an `encrypted`
  // collection. The declaration stays at `{vault}/{name}/`.
  bool isolated = 4;
  // Document files are age armor on disk; reading and writing them takes
  // the Vault's secret. Independent of `isolated`. A journal may not set
  // it.
  bool encrypted = 5;
  // What the Index holds of this collection; unset is `INDEX_SCOPE_ALL`.
  // Redundant, and allowed, on `encrypted`, which no Index holds. A change
  // never makes the Index stale: the next round rebuilds the table of this
  // collection.
  IndexScope index_scope = 6 [(buf.validate.field) = {
    enum: {defined_only: true}
    cel: [
      {
        id: "schema.index_scope.defined"
        message: "must be a defined IndexScope value"
        expression: "this in [0, 1, 2, 3]"
      }
    ]
  }];
}

// The `standard` kind. No option of its own.
message Standard {}

// The `journal` kind: how its segment files are cut. Size first: a cap
// that is hit closes a segment, even in the middle of a day. The library
// names the segment files.
message Journal {
  // Bytes per segment. Unset: 128 KiB. Set: 1 byte to 32 MiB.
  uint64 segment_max_bytes = 1 [(buf.validate.field) = {
    uint64: {
      gte: 1
      lte: 33554432
    }
  }];
  // Lines per segment, besides the byte cap. Unset: no line cap. Set: at
  // least 1.
  uint64 segment_max_lines = 2 [(buf.validate.field) = {
    uint64: {gte: 1}
  }];
  // Set: a new segment every day (UTC), still size first. Unset: no
  // calendar rotation.
  Unit daily = 3;
}

// The `singleton` kind: the one `id` its Document has. A slug, checked by
// the library; an extension, if any, is part of the `id`.
message Singleton {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
}

// An empty mark: `Journal.daily`.
message Unit {}

// The answer of `Vault.ListCollections`.
message Collections {
  repeated CollectionDeclaration collections = 1;
}

// The name of a collection, for a call about one.
message CollectionKey {
  string name = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
}

// The request of `Vault.DeleteCollection`.
message CollectionDeletion {
  string name = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
  // An unknown collection is nothing to do, not `NOT_FOUND`.
  bool ignore_missing = 2;
}

// One item of `Vault.BatchCollections`: the request of one collection
// call.
message CollectionOperation {
  oneof operation {
    option (buf.validate.oneof).required = true;
    // As `Vault.CreateCollection`.
    CollectionDeclaration create = 1;
    // As `Vault.UpdateCollection`.
    CollectionDeclaration update = 2;
    // As `Vault.DeleteCollection`.
    CollectionDeletion delete = 3;
  }
}

// The answer of `Vault.BatchCollections`: one result per operation, in
// order.
message CollectionBatchResult {
  repeated CollectionResult results = 1;
}

// What one collection call of a batch returned.
message CollectionResult {
  oneof result {
    // A created or updated declaration, as stored.
    CollectionDeclaration collection = 1;
    // A deleted one.
    google.protobuf.Empty deleted = 2;
  }
}
