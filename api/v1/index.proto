// Index rebuild result. Bindings and the CLI encode these messages as
// Protobuf JSON, not binary protobuf. Vault files stay YAML / JSONL. The
// Index lives under `{vault}/.scheda/`; isolated Index under
// `{vault}/.isolated/.scheda/`.

edition = "2024";

package api.v1;

// Written by `reindex` from Vault files, not from a previous Index.
message ReindexResult {
  uint64 records_read = 1;
  uint64 skipped_invalid = 2;
  uint64 segments_seen = 3;
}
