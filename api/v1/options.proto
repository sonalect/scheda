// Options for `open`. Bindings and the CLI encode these messages as
// Protobuf JSON, not binary protobuf. Vault files stay YAML / JSONL.
// Index lives at `{vault}/.scheda/index`; callers do not pass an Index
// directory.

edition = "2024";

package api.v1;

import "api/v1/author.proto";
import "api/v1/encryption.proto";
import "buf/validate/validate.proto";

message OpenOptions {
  // Unset means off.
  bool auto_sync = 1;
  // Clone URL when `path` does not exist. Unset means local `git init`.
  // When `path` is already a Vault, a set value must match the fetch URL of
  // `origin`; otherwise `invalid`. Unset on an existing Vault attaches and
  // does not change `origin`. A set value must be an absolute URI (RFC 3986):
  // `https://…`, `ssh://…`, `file:///…`.
  string remote_repo = 2 [(buf.validate.field) = {
    string: {uri: true}
    cel: [
      {
        id: "open_options.remote_repo.uri"
        message: "must be a valid URI"
        expression: "this.isUri()"
      }
    ]
  }];
  // Age secret for this handle. Unset: encryption is not requested.
  // When set, `passphrase` or `identity` is required. Applies to
  // encryption generally, not only to `{vault}/.isolated/`.
  Encryption encryption = 3;
  // Git author and committer for every commit on this handle (main tree
  // and `{vault}/.isolated/`). Unset: local git config, then
  // `Scheda <scheda@invalid>`.
  Author author = 4;
  // Machine-local identity of the process that writes this clone.
  // Unset: generated on first `open` and stored in `{vault}/.scheda/writer`.
  // When set: lowercase alphanumeric plus `-`, 1–32 bytes, so it can sit
  // in a journal segment file name. Must not start with eight hexadecimal
  // digits (those names are sequence segments). Never committed (`.scheda/` is
  // gitignored).
  string writer = 5 [(buf.validate.field) = {
    string: {
      min_len: 1
      max_len: 32
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
    }
  }];
}
