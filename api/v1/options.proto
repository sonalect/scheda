// Options for `init` / `open` (`07` LIB-4, LIB-13). Bindings and agent
// transport (`08`) use proto3 JSON of these messages, not binary protobuf.
// Vault files stay YAML / JSONL (`04`).

edition = "2024";

package api.v1;

// Lock and remote policy. Unset `write` means the binding default (write).
// Unset `auto_sync` means off. Index lives at `{vault}/.scheda/index` (GIT-13);
// callers do not pass an Index directory.
message OpenOptions {
  bool write = 1;
  bool auto_sync = 2;
  // GIT-9. Empty means unset. `open` of an existing repository with this set
  // is `invalid`. `init` with this set is `clone`.
  string remote_repo = 3;
}
