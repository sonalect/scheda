// Options for `open`. Bindings and the CLI encode these messages as
// Protobuf JSON, not binary protobuf. Vault files stay YAML / JSONL.
// Index lives at `{vault}/.scheda/index`; callers do not pass an Index
// directory.

edition = "2024";

package api.v1;

import "api/v1/author.proto";
import "api/v1/encryption.proto";
import "buf/validate/validate.proto";

message OpenOptions {
  // Unset means off.
  bool auto_sync = 1;
  // Clone URL when `path` does not exist. Unset means local `git init`.
  // When `path` is already a Vault, a set value must match the fetch URL of
  // `origin`; otherwise `invalid`. Unset on an existing Vault attaches and
  // does not change `origin`. A set value must be an absolute URI (RFC 3986:
  // `https://…`, `ssh://…`, `file:///…`) or an scp-style address
  // (`git@host:path`). Git clone understands both. A hybrid
  // `ssh://git@host:path` (colon after the host) is not a URI and is not
  // scp-style.
  string remote_repo = 2 [(buf.validate.field) = {
    cel: [
      {
        id: "open_options.remote_repo.uri"
        message: "must be an absolute URI (https://…, ssh://…, file:///…) or an scp-style address (git@host:path)"
        expression: "this.isUri() || (this.contains('@') && this.contains(':') && !this.contains('://'))"
      }
    ]
  }];
  // Age secret for this handle. Unset: encryption is not requested.
  // When set, `passphrase` or `identity` is required. Applies to
  // encryption generally, not only to `{vault}/.isolated/`.
  Encryption encryption = 3;
  // Git author and committer for every commit on this handle (main tree
  // and `{vault}/.isolated/`). Unset: local git config, then
  // `Scheda <scheda@invalid>`.
  Author author = 4;
  // Machine-local identity of the process that writes this clone.
  // Unset: generated on first `open` and stored in `{vault}/.scheda/writer`.
  // When set: lowercase alphanumeric plus `-`, 1–32 bytes, so it can sit
  // in a journal segment file name. Must not start with eight hexadecimal
  // digits (those names are sequence segments). Never committed (`.scheda/` is
  // gitignored).
  string writer = 5 [(buf.validate.field) = {
    string: {
      min_len: 1
      max_len: 32
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
    }
  }];
  // How often the background indexer reads `HEAD`, in milliseconds, to
  // notice commits made outside this handle (a `git` command, another
  // process). A commit through this handle wakes the indexer at once.
  // Unset: 1000.
  uint32 index_poll_ms = 6 [(buf.validate.field) = {
    uint32: {
      gte: 10
      lte: 3600000
    }
  }];
  // Open only a Vault that already exists. Unset means off: `open` opens
  // or creates.
  //
  // Set: `open` accepts only a git work tree that holds the marker file
  // `{vault}/.scheda.yaml`. A missing path is `not_found`;
  // a folder without the marker (a plain git repository, a folder that is
  // not a git work tree) is `not_a_vault`. It never runs `git init`, never
  // clones (`remote_repo` is not used to create), and writes nothing to the
  // folder before it has accepted it: no `.scheda/`, no `.gitignore` change,
  // no commit.
  //
  // Unset: a missing path is created or cloned, and the marker is written
  // into the first commit. A git work tree without the marker gets the
  // marker in one commit, then opens. A folder that exists and is not a git
  // work tree is `invalid`.
  //
  // A marker that cannot be read, or whose `version` is not 1, is refused
  // in both modes (`invalid`).
  bool existing_only = 7;
}
