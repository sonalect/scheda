// Record history page. Bindings and the CLI encode these messages as
// Protobuf JSON, not binary protobuf. Newest first. Line-level journal
// blame is later. This is output, not a write envelope: no field validators.
// `Collection.history` is paged (`offset`, `count`); this message is one
// page. The caller passes Record `id`, not a file path.

edition = "2024";

package api.v1;

import "google/protobuf/timestamp.proto";

message History {
  // One page of commits, newest first. Empty if `offset` is past the last
  // commit. Length is at most `count`.
  repeated Entry entries = 1;

  // One git commit that changed the file this Record is stored in
  // (`document` / `singleton` file, or the `journal` segment that contains
  // the line).
  message Entry {
    // Git commit object id (hex).
    string hash = 1;
    // Commit instant (UTC). Proto3 JSON is RFC 3339. Git `Time.seconds` is
    // already seconds since epoch; the display timezone is not stored.
    google.protobuf.Timestamp time = 2;
    // Git author as `Name <email>`.
    string author = 3;
    // Git commit message.
    string message = 4;
    // Bytes of that file at this commit (`git show`). Not a Record envelope.
    // For `journal`, the whole segment, not one line.
    bytes raw = 5;
  }
}
