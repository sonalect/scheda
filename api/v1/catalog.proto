// Schema catalog (`08` AGT-1, `07` LIB-20). Bindings and agent transport
// (`08`) use the Protobuf JSON mapping of these messages, not binary
// protobuf. Field names follow `05` §8. Vault files stay YAML / JSONL (`04`).

edition = "2024";

package api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// AGT-1. One Vault's Schema, not a walk of Record directories.
message Catalog {
  repeated CatalogCollection collections = 1;
}

// One collection declaration (`05` §8). Isolated collections may omit
// `fields` (ISO-3).
message CatalogCollection {
  string name = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
  string kind = 2 [(buf.validate.field) = {
    required: true
    string: {
      in: [
        "document",
        "journal",
        "singleton"
      ]
    }
  }];
  uint32 schema_version = 3 [(buf.validate.field) = {
    uint32: {gte: 1}
  }];
  repeated string layout = 4;
  CatalogId id = 5;
  repeated CatalogField fields = 6;
  uint64 segment_max_bytes = 7;
  uint64 segment_max_lines = 8;
  string segment_rotate = 9 [(buf.validate.field) = {
    string: {
      in: ["daily"]
    }
  }];
  string singleton_id = 10;
  CatalogBody body = 11;
  bool isolated = 12;
}

message CatalogId {
  string field = 1;
  string pattern = 2;
}

message CatalogField {
  string name = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
  string type = 2 [(buf.validate.field) = {
    required: true
    string: {
      in: [
        "string",
        "integer",
        "number",
        "boolean",
        "string_list",
        "object",
        "object_list"
      ]
    }
  }];
  bool required = 3;
  bool nullable = 4;
  bool filter = 5;
  bool fts = 6;
  bool vector = 7;
  string field_id = 8;
  CatalogEdge edge = 9;
  google.protobuf.Value default = 10;
  repeated CatalogField fields = 11;
}

message CatalogEdge {
  string collection = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
  string multiplicity = 2 [(buf.validate.field) = {
    string: {
      in: [
        "one",
        "many"
      ]
    }
  }];
  string dangling = 3 [(buf.validate.field) = {
    string: {
      in: [
        "lax",
        "strict"
      ]
    }
  }];
}

message CatalogBody {
  bool allowed = 1;
  bool fts = 2;
  bool vector = 3;
  string field_id = 4;
}
