// Age secret: a passphrase or an X25519 identity. Bindings and the CLI
// encode these messages as Protobuf JSON, not binary protobuf. Vault
// files stay YAML / JSONL. The secret is never written into Vault files.
// `debug_redact` keeps the secret out of generated `Debug` output; the
// Protobuf JSON mapping still carries it.

edition = "2024";

package api.v1;

import "buf/validate/validate.proto";

message Encryption {
  // Exactly one arm. Empty string is invalid.
  oneof secret {
    option (buf.validate.oneof).required = true;
    // Symmetric secret. Age scrypt wrapping.
    string passphrase = 1 [
      debug_redact = true,
      (buf.validate.field) = {
        string: {min_len: 1}
      }
    ];
    // Age X25519 identity (`AGE-SECRET-KEY-…` file).
    string identity = 2 [
      debug_redact = true,
      (buf.validate.field) = {
        string: {min_len: 1}
      }
    ];
  }
}
