// Library API failures. Bindings and the CLI encode these messages as
// Protobuf JSON, not binary protobuf. Vault files stay YAML / JSONL.

edition = "2024";

package api.v1;

import "buf/validate/validate.proto";

// Recoverable failure. `code` is the class a caller branches on; `message`
// must not replace it.
message Error {
  // One code per distinct failure class a caller can branch on.
  // Collection/envelope rule text stays in `message` under `CODE_INVALID`.
  // Zero is unset.
  enum Code {
    CODE_UNSPECIFIED = 0;

    // Record / Vault identity.
    CODE_NOT_FOUND = 101;
    CODE_DUPLICATE_ID = 102;
    CODE_CONFLICT_MARKERS = 103;

    // Caller or collection declaration. Detail is `message` (and `path` when a file).
    CODE_INVALID = 201;
    CODE_NOT_UTF8 = 202;

    // Writes / remotes this handle cannot do.
    CODE_UNSUPPORTED = 301;
    CODE_UNSUPPORTED_REMOTE = 302;
    CODE_LOCKED = 303;

    // Filesystem / OS: one code per stable `std::io::ErrorKind`.
    // `CODE_IO_OTHER` is `ErrorKind::Other` and any future/unstable kind.
    CODE_IO_NOT_FOUND = 401;
    CODE_IO_PERMISSION = 402;
    CODE_IO_CONNECTION_REFUSED = 403;
    CODE_IO_CONNECTION_RESET = 404;
    CODE_IO_HOST_UNREACHABLE = 405;
    CODE_IO_NETWORK_UNREACHABLE = 406;
    CODE_IO_CONNECTION_ABORTED = 407;
    CODE_IO_NOT_CONNECTED = 408;
    CODE_IO_ADDR_IN_USE = 409;
    CODE_IO_ADDR_NOT_AVAILABLE = 410;
    CODE_IO_NETWORK_DOWN = 411;
    CODE_IO_BROKEN_PIPE = 412;
    CODE_IO_ALREADY_EXISTS = 413;
    CODE_IO_WOULD_BLOCK = 414;
    CODE_IO_NOT_A_DIRECTORY = 415;
    CODE_IO_IS_A_DIRECTORY = 416;
    CODE_IO_DIRECTORY_NOT_EMPTY = 417;
    CODE_IO_READ_ONLY_FILESYSTEM = 418;
    CODE_IO_STALE_NETWORK_FILE_HANDLE = 419;
    CODE_IO_INVALID_INPUT = 420;
    CODE_IO_INVALID_DATA = 421;
    CODE_IO_TIMED_OUT = 422;
    CODE_IO_WRITE_ZERO = 423;
    CODE_IO_STORAGE_FULL = 424;
    CODE_IO_NOT_SEEKABLE = 425;
    CODE_IO_QUOTA_EXCEEDED = 426;
    CODE_IO_FILE_TOO_LARGE = 427;
    CODE_IO_RESOURCE_BUSY = 428;
    CODE_IO_EXECUTABLE_FILE_BUSY = 429;
    CODE_IO_DEADLOCK = 430;
    CODE_IO_CROSSES_DEVICES = 431;
    CODE_IO_TOO_MANY_LINKS = 432;
    CODE_IO_INVALID_FILENAME = 433;
    CODE_IO_ARGUMENT_LIST_TOO_LONG = 434;
    CODE_IO_INTERRUPTED = 435;
    CODE_IO_UNSUPPORTED = 436;
    CODE_IO_UNEXPECTED_EOF = 437;
    CODE_IO_OUT_OF_MEMORY = 438;
    CODE_IO_OTHER = 439;

    // git2 `ErrorCode`, one proto value each. Fast-forward pull/push is
    // `not_fast_forward`. `CODE_GIT_HEAD` is ours (HEAD is not a branch),
    // not a git2 code.
    CODE_NOT_FAST_FORWARD = 501;
    CODE_GIT_GENERIC = 502;
    CODE_GIT_NOT_FOUND = 503;
    CODE_GIT_EXISTS = 504;
    CODE_GIT_AMBIGUOUS = 505;
    CODE_GIT_BUF_SIZE = 506;
    CODE_GIT_USER = 507;
    CODE_GIT_BARE_REPO = 508;
    CODE_GIT_UNBORN_BRANCH = 509;
    CODE_GIT_UNMERGED = 510;
    CODE_GIT_INVALID_SPEC = 511;
    CODE_GIT_CONFLICT = 512;
    CODE_GIT_LOCKED = 513;
    CODE_GIT_MODIFIED = 514;
    CODE_GIT_AUTH = 515;
    CODE_GIT_CERTIFICATE = 516;
    CODE_GIT_APPLIED = 517;
    CODE_GIT_PEEL = 518;
    CODE_GIT_EOF = 519;
    CODE_GIT_INVALID = 520;
    CODE_GIT_UNCOMMITTED = 521;
    CODE_GIT_DIRECTORY = 522;
    CODE_GIT_MERGE_CONFLICT = 523;
    CODE_GIT_HASHSUM_MISMATCH = 524;
    CODE_GIT_INDEX_DIRTY = 525;
    CODE_GIT_APPLY_FAIL = 526;
    CODE_GIT_OWNER = 527;
    CODE_GIT_TIMEOUT = 528;
    CODE_GIT_HEAD = 529;

    // Derived Index, not Vault text.
    CODE_INDEX_MISSING = 601;
    CODE_INDEX_VERSION = 602;
    CODE_INDEX_LEXICAL = 603;
    CODE_INDEX_VECTOR = 604;
    CODE_INDEX_CORRUPT = 605;
  }

  // Whether the same call with the same arguments may succeed later.
  // Example: a network failure is `REPEAT_ALLOWED` once the connection is
  // back. Bad input is `REPEAT_FORBIDDEN`.
  enum Repeat {
    REPEAT_UNSPECIFIED = 0;
    REPEAT_ALLOWED = 1;
    REPEAT_FORBIDDEN = 2;
  }

  Code code = 1 [(buf.validate.field) = {
    required: true
    enum: {
      defined_only: true
      not_in: [0]
    }
  }];
  string message = 2;
  // Vault-relative POSIX path of the file this failure is about, same
  // meaning as `Record.path`. Unset when there is no such file.
  string path = 3 [(buf.validate.field) = {
    string: {min_len: 1}
  }];
  Repeat repeat = 4 [(buf.validate.field) = {
    required: true
    enum: {
      defined_only: true
      not_in: [0]
    }
  }];
  // Causal context, outermost frame first: operation names only
  // (`get`, `read`), not a language backtrace. Must not repeat `path`
  // and must not replace `code`.
  repeated string stack = 5 [(buf.validate.field) = {
    repeated: {
      items: {
        string: {min_len: 1}
      }
    }
  }];
}
