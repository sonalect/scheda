// Snapshot for `Vault.info`. Bindings and the CLI encode these messages as
// Protobuf JSON, not binary protobuf. This is not a live Vault handle. No
// field validators: this is info, not a write envelope. Collection list
// items are `api.collection.v1.CollectionInfo` (including `version`).

edition = "2024";

package api.v1;

import "api/collection/v1/collection.proto";

message VaultInfo {
  // Working-tree root passed to `open`. POSIX when the host uses POSIX;
  // not a Record `path`.
  string path = 1;
  // Index directory `{vault}/.scheda/index`. Not a caller option.
  string index_path = 2;
  // Git remote name Scheda uses (`origin`). Empty means no Remote.
  // Other remotes in git config are ignored. Local read; not a fetch.
  string remote = 3;
  // `OpenOptions.auto_sync` on this handle. Unset in proto is false.
  bool auto_sync = 4;
  // Declared collections. Not inferred from Record directories.
  // Isolated collections appear here. Each item includes `version`.
  repeated api.collection.v1.CollectionInfo collections = 5;
}
