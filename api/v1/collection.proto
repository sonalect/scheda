// Collection list item inside `api.v1.VaultInfo` (`Vault.info`). Bindings and
// the CLI encode these messages as Protobuf JSON, not binary protobuf. This
// is not a live Collection handle. No field validators on this message: this
// is info, not a write envelope. Isolated collections may omit `schema.fields`.

edition = "2024";

package api.v1;

import "api/v1/schema.proto";

message CollectionInfo {
  // Collection directory. Slug checked in the library (same as Record `id`).
  // Not a field on `Schema`: `create_collection` takes it as an argument.
  string name = 1;
  // Declaration (`Vault.create_collection` / `{name}/.schema.yaml` in the
  // main tree). Isolated Record files live under `.isolated/{name}/`.
  Schema schema = 2;
}
