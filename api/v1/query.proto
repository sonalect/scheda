// `find` filter and `reindex` counts (`07` LIB-10, LIB-16; SCH-8, QRY-2).
// Bindings and agent transport (`08`) use the Protobuf JSON mapping of these
// messages, not binary protobuf. Vault files stay YAML / JSONL (`04`).

edition = "2024";

package api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// SCH-8 constraints. Empty `clauses` matches every Record in the collection.
// Clauses are combined with AND.
message Filter {
  repeated FilterClause clauses = 1;
}

message FilterClause {
  oneof kind {
    option (buf.validate.oneof).required = true;
    Equal equal = 1;
    Set set = 2;
    Exists exists = 3;
    PathPrefix path_prefix = 4;
  }
}

// Field equality, including JSON `null` (stored `null`, not an absent key).
message Equal {
  string field = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
  google.protobuf.Value value = 2 [(buf.validate.field) = {required: true}];
}

// Set membership: the field's value equals one of `values`.
message Set {
  string field = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
  google.protobuf.ListValue values = 2 [(buf.validate.field) = {required: true}];
}

// Key is present (`null` counts).
message Exists {
  string field = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
}

// Vault-relative POSIX prefix of Record `path`. `document` / `singleton` only.
message PathPrefix {
  string prefix = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
}

// LIB-16. Written by `reindex` from Vault files, not from a previous Index.
message ReindexCounts {
  uint64 records_read = 1;
  uint64 skipped_invalid = 2;
  uint64 segments_seen = 3;
}

// LIB-11. Hybrid `search` (QRY-3–6). Unset or zero `k` → 10. Unset weights → 1.
// Zero weight turns that leg off for fusion. Weights, when set, are finite
// and >= 0. `filter` is SCH-8, same as `find`.
message SearchQuery {
  string text = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
  uint32 k = 2;
  Filter filter = 3;
  double lexical_weight = 4 [(buf.validate.field) = {
    double: {
      gte: 0
      finite: true
    }
    // codegen 0.6.0 parses `finite` but does not emit it; field CEL does.
    cel: [
      {
        id: "search.lexical_weight.finite"
        message: "must be finite"
        expression: "!this.isNan() && !this.isInf()"
      }
    ]
  }];
  double vector_weight = 5 [(buf.validate.field) = {
    double: {
      gte: 0
      finite: true
    }
    cel: [
      {
        id: "search.vector_weight.finite"
        message: "must be finite"
        expression: "!this.isNan() && !this.isInf()"
      }
    ]
  }];
}

message SearchHit {
  string collection = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
  string id = 2 [(buf.validate.field) = {
    required: true
    string: {
      min_len: 1
      pattern: "^[^/\\\\]+$"
    }
  }];
  string path = 3;
  double lexical_score = 4 [(buf.validate.field) = {
    double: {
      gte: 0
      finite: true
    }
    cel: [
      {
        id: "search.lexical_score.finite"
        message: "must be finite"
        expression: "!this.isNan() && !this.isInf()"
      }
    ]
  }];
  double vector_score = 5 [(buf.validate.field) = {
    double: {
      gte: 0
      finite: true
    }
    cel: [
      {
        id: "search.vector_score.finite"
        message: "must be finite"
        expression: "!this.isNan() && !this.isInf()"
      }
    ]
  }];
  double rrf_score = 6 [(buf.validate.field) = {
    double: {
      gte: 0
      finite: true
    }
    cel: [
      {
        id: "search.rrf_score.finite"
        message: "must be finite"
        expression: "!this.isNan() && !this.isInf()"
      }
    ]
  }];
}

message SearchHits {
  repeated SearchHit hits = 1;
}
