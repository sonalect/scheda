// `Vault.search` / `Collection.search`. Bindings and the CLI encode these
// messages as Protobuf JSON, not binary protobuf. Vault files stay YAML /
// JSONL.
//
// Hybrid retrieval: BM25 (Tantivy) and ANN (USearch), fused with RRF.
// Collection names are a method argument on `Vault.search`, not a field
// here. No Record path on the request. When `filter` is set, Tantivy runs
// it first; both legs search only that `(collection, id)` set (lexical:
// `Must` + text; vector: `filtered_search`). Unset `filter` → both legs
// on the selected collections. Optional reranker is a library callback on
// `search`, not a field here. When set, hits are ordered by `rerank_score`.

edition = "2024";

package api.v1;

import "api/v1/find.proto";
import "buf/validate/validate.proto";

message SearchQuery {
  string text = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
  // Unset or `0` → 10.
  uint32 k = 2;
  Filter filter = 3;
  // Unset → 1. Zero turns that leg off. When set: finite and >= 0.
  double lexical_weight = 4 [(buf.validate.field) = {
    double: {
      gte: 0
      finite: true
    }
    cel: [
      {
        id: "search.lexical_weight.finite"
        message: "must be finite"
        expression: "!this.isNan() && !this.isInf()"
      }
    ]
  }];
  double vector_weight = 5 [(buf.validate.field) = {
    double: {
      gte: 0
      finite: true
    }
    cel: [
      {
        id: "search.vector_weight.finite"
        message: "must be finite"
        expression: "!this.isNan() && !this.isInf()"
      }
    ]
  }];
  // When true, fill `Hit.raw`. Unset or false → omit those bytes.
  bool include_raw = 6;
  // When set, the reranker scores only the top N fused hits (RRF order).
  // Unset → score every fused hit. Ignored when no reranker is passed.
  // Zero is invalid.
  uint32 rerank_limit = 7 [(buf.validate.field) = {
    uint32: {gte: 1}
  }];
}

// Output, not a write envelope: no field validators (same as `FindResult`).
message SearchHits {
  // Ranked page, length at most `k`. Empty if nothing matched.
  repeated Hit hits = 1;

  message Hit {
    // Collection name (directory). Output only. Same as
    // `Record.collection`.
    string collection = 1;
    string id = 2;
    // Vault-relative POSIX path. Output only.
    string path = 3;
    // Set only when that leg produced the hit.
    double lexical_score = 4;
    double vector_score = 5;
    double rrf_score = 6;
    // Set only when `search` was called with a reranker.
    double rerank_score = 7;
    // Bytes of that Record as stored. Set only when `SearchQuery.include_raw`.
    bytes raw = 8;
  }
}
