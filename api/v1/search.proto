// `Vault.search` / `Collection.search`. Bindings and the CLI encode these
// messages as Protobuf JSON, not binary protobuf. Vault files stay YAML /
// JSONL.
//
// Hybrid retrieval: BM25 (Tantivy) and ANN (USearch). Without a reranker,
// ranks fuse with Reciprocal Rank Fusion. With a reranker, the pool is
// filled by alternating the two legs' ranks; RRF scores are still
// reported. Collection names are a method argument on `Vault.search`, not
// a field here. No Record path on the request. When `filter` is set,
// Tantivy runs it first; both legs search only that `(collection, id)`
// set (lexical: `Must` + text; vector: `filtered_search`). Unset `filter`
// → both legs on the selected collections. Optional reranker is a library
// callback on `search`, not a field here. When set, hits are ordered by
// `rerank_score`.

edition = "2024";

package api.v1;

import "api/v1/find.proto";
import "buf/validate/validate.proto";

message SearchQuery {
  string text = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
  // Unset or `0` → 10. At most 10000.
  uint32 k = 2 [(buf.validate.field) = {
    uint32: {lte: 10000}
  }];
  Filter filter = 3;
  // Unset → 1. Zero turns that leg off. When set: finite and >= 0.
  // Without a reranker the weights also scale Reciprocal Rank Fusion
  // (order and truncation). With a reranker they no longer decide pool
  // membership: each running leg's ranks fill the pool by alternation.
  double lexical_weight = 4 [(buf.validate.field) = {
    double: {
      gte: 0
      finite: true
    }
    cel: [
      {
        id: "search.lexical_weight.finite"
        message: "must be finite"
        expression: "!this.isNan() && !this.isInf()"
      }
    ]
  }];
  double vector_weight = 5 [(buf.validate.field) = {
    double: {
      gte: 0
      finite: true
    }
    cel: [
      {
        id: "search.vector_weight.finite"
        message: "must be finite"
        expression: "!this.isNan() && !this.isInf()"
      }
    ]
  }];
  // When true, fill `Hit.raw`. Unset or false → omit those bytes.
  bool include_raw = 6;
  // When set with a reranker, both Index legs retrieve max(k, 50, N) and
  // the reranker scores the first N fused candidates (alternating legs
  // when both ran). Unset → pool stays max(k, 50) and every fused hit is
  // scored. Ignored when no reranker is passed. Zero is invalid. At most
  // 10000. N larger than the corpus is not an error.
  uint32 rerank_limit = 7 [(buf.validate.field) = {
    uint32: {gte: 1 lte: 10000}
  }];
}

// Output, not a write envelope. The one validator is on `vector_leg`,
// which every `search` sets.
message SearchHits {
  // Ranked page, length at most `k`. Empty if nothing matched.
  repeated Hit hits = 1;
  // What the vector leg of this `search` did, decided before the query
  // runs from what the handle already holds. A vector-only query
  // (`lexical_weight` 0) with no hits and a value other than
  // `VECTOR_LEG_RAN` did not search vectors at all.
  VectorLeg vector_leg = 2 [(buf.validate.field) = {
    required: true
    enum: {
      defined_only: true
      not_in: [0]
    }
    cel: [
      {
        id: "search_hits.vector_leg.not_unspecified"
        message: "vector_leg must not be unspecified"
        expression: "this != 0"
      }
    ]
  }];

  // Why the vector leg ran or did not. The first that applies, in this
  // order, is reported.
  enum VectorLeg {
    // Unset. Never returned by `search`.
    VECTOR_LEG_UNSPECIFIED = 0;
    // The leg was not asked for: `vector_weight` is 0.
    VECTOR_LEG_NOT_ASKED = 1;
    // No requested collection has vector slots: every one is excluded
    // (`exclude_vector_index`, encrypted), the handle has no Projector,
    // or the Projector marks no column `vector`.
    VECTOR_LEG_NO_VECTOR_COLLECTION = 2;
    // The handle has no embedder, so the query is not embedded.
    VECTOR_LEG_NO_EMBEDDER = 3;
    // The Index holds no vectors yet.
    VECTOR_LEG_NO_VECTORS = 4;
    // The embedder's `model_id` or dimensions differ from the Index
    // vectors; `reindex` with this embedder moves the Index to it.
    VECTOR_LEG_MODEL_MISMATCH = 5;
    // The leg ran: the query was embedded and the vectors searched.
    VECTOR_LEG_RAN = 6;
  }

  message Hit {
    // Collection name (directory). Output only. Same as
    // `Record.collection`.
    string collection = 1;
    string id = 2;
    // Set only when that leg produced the hit.
    double lexical_score = 3;
    double vector_score = 4;
    double rrf_score = 5;
    // Set only when `search` was called with a reranker.
    double rerank_score = 6;
    // Bytes of that Record as stored. Set only when `SearchQuery.include_raw`.
    bytes raw = 7;
  }
}
