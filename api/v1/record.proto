// Record I/O. Bindings and the CLI encode these messages as Protobuf JSON,
// not binary protobuf. Vault Record files are opaque UTF-8; this file
// is not YAML/JSONL. Collection declaration is `Declaration`.
//
// The collection name on `Record` / `Hit` is output only (`get` / `find` /
// `search`). `add` / `replace` take the bytes as a method argument, not a
// message. Identity is `(collection, id)`; the caller never supplies a
// Record file path.

edition = "2024";

package api.v1;

// `get` / `walk` result; also one item inside `FindResult`. Output, not a
// write envelope:
// no field validators (same as `History`).
message Record {
  // Collection name (directory). Output only. Set on `get` / `find`.
  // Not an input: `add` / `replace` use the collection handle.
  string collection = 1;
  string id = 2;
  // Document / singleton: file bytes. Journal: envelope payload after `: `.
  bytes raw = 3;
}
