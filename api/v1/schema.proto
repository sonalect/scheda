// Collection declaration for `Vault.create_collection`. The collection name is
// a method argument, not a field here. Bindings and the CLI encode these
// messages as Protobuf JSON, not binary protobuf. On-disk declaration files
// are `{name}/.collection.yaml` (also `.yml` / `.json`). There is no field
// list. Collection generation `version` lives on the YAML/JSON file, not on
// this message.
//
// The caller never supplies a Record file path. Only `Vault.open` takes a
// filesystem path (the Vault root).

edition = "2024";

package api.v1;

import "buf/validate/validate.proto";

message Declaration {
  // Exactly one kind. The set arm is the kind (`document` | `journal` |
  // `singleton`).
  oneof kind {
    option (buf.validate.oneof).required = true;
    // `document`. Empty Unit. File: `{name}/{id}`.
    Unit document = 2;
    Journal journal = 3;
    Singleton singleton = 4;
  }
  // Later. Default false. `true`: Record files live under
  // `{vault}/.isolated/{name}/` (gitignored nested git). The declaration
  // file stays `{vault}/{name}/.collection.yaml`. Search over non-isolated
  // collections does not read it.
  bool isolated = 5;
  // Record files of this collection are age armor on disk. Independent
  // of `isolated`. I/O requires the handle secret. `journal` may not
  // set it.
  bool encrypted = 6;
  // Default false: Records enter the Tantivy Index (`find`, filters,
  // BM25). `true`: no Record of this collection is written there.
  // `find` that names it is refused, not an empty hit list. The journal
  // id map is a separate JSONL file and is still written. Redundant on
  // `encrypted` (ciphertext is never indexed) and allowed. A `journal`
  // may set it.
  bool exclude_lexical_index = 7;
  // Default false: eligible columns are embedded on write. `true`: no
  // Record of this collection is embedded or stored in the vector
  // Index; `add` / `replace` do not call the embedder. `search` then
  // uses the lexical leg only. Redundant on `encrypted` and allowed.
  // A `journal` may set it.
  bool exclude_vector_index = 8;
}

// `journal` segment cap. Size-first: a cap hit closes the segment even
// mid-day. Segment files live in the collection directory; the library
// names them.
message Journal {
  // Byte cap. Omitted → default 8 MiB. If set, 1…32 MiB.
  uint64 segment_max_bytes = 1 [(buf.validate.field) = {
    uint64: {
      gte: 1
      lte: 33554432
    }
  }];
  // Optional line cap in addition to the byte cap. Omitted → no line cap.
  // If present, must be >= 1.
  uint64 segment_max_lines = 2 [(buf.validate.field) = {
    uint64: {gte: 1}
  }];
  // Set → rotate daily (UTC), still size-first. Omitted → no calendar
  // rotation.
  Unit daily = 3;
}

// `singleton`: the one Record `id`. Slug checked in the library.
// File is `{name}/{id}` (or `.isolated/{name}/{id}`).
message Singleton {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
}

// `integer` / `number` / `boolean` markers elsewhere, and empty `document`.
message Unit {}
