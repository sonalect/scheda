// YAML 1.2 or JSON on disk for `{vault}/.scheda.yaml`. Field names match this
// file's JSON mapping. Not binary protobuf.

edition = "2024";

package api.v1;

import "buf/validate/validate.proto";

// The marker file at the Vault root. It is committed to git, so it survives
// a clone (`.scheda/` is gitignored and does not). A folder that holds it is
// a Vault; `open` creates it on a Vault that lacks it unless
// `OpenOptions.existing_only` is set.
message VaultMarker {
  // Vault format generation: the file shape and the on-disk layout of the
  // Vault. Field number is always 1. Value must be 1. No default.
  int32 version = 1 [(buf.validate.field) = {
    required: true
    int32: {const: 1}
  }];
}
