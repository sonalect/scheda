version: v2
inputs:
  - directory: .
    paths:
      - api/v1
plugins:
  - local: protoc-gen-buffa
    out: rust/api/api/v1
    opt:
      - json=true
      - extern_path=.api.collection.v1=crate::api::collection::v1
  - local: protoc-gen-buffa-packaging
    out: rust/api/api/v1
    strategy: all
  - local: protoc-gen-protovalidate-buffa
    out: rust/api/api/v1
    strategy: all
    opt:
      - proto_module=crate::api
      - packaging=false
