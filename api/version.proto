// File schema version. Field number is always 1. Value must be 1.
// On-disk YAML/JSON is this file's JSON mapping, not binary protobuf.

edition = "2024";

package api;

import "buf/validate/validate.proto";

// Shared on-disk file version. Every proto field named `version` must be
// field number 1 with this same const.
message Version {
  // File schema version. Must be `1`.
  int32 version = 1 [(buf.validate.field) = {
    required: true
    int32: {const: 1}
  }];
}
