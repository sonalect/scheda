# Opt-in static CRT for the CLI. Default Cargo stays dynamic.
#
# rustc cannot compile proc-macros with +crt-static on the host, so Cargo
# needs `--target` even for a native build. Host-tuple commands (bash,
# PowerShell, cmd) are in README.md. Unset RUSTFLAGS and
# CARGO_ENCODED_RUSTFLAGS or they override rustflags.

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+crt-static"]
