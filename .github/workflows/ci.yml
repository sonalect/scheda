name: CI

# Six platforms: Linux, macOS, and Windows, each on amd64 and arm64. Five
# run the full `bazel build //...` and `bazel test //...`. Windows arm64
# builds and tests the Rust workspace with Cargo instead: there ring's build
# script compiles with clang, and rules_rust hands every build script the
# cl.exe flags of the C++ toolchain (`/nologo`, `/MD`, ...), which clang
# reads as file names; rules_rust can add to those flags but not drop them.
#
# Automatic CI is disabled: a manual run (workflow_dispatch) on any branch.
# Restore push/pull_request to re-enable.
#
# Bazel caches: only --disk_cache and --repository_cache (never the output
# root, which holds a live server). A run may restore caches of its own ref
# or of the default branch, so only a run on main saves them, and a run on
# another branch starts from main's.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BAZELISK_VERSION: 1.29.0

defaults:
  run:
    shell: bash

jobs:
  platform:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-26.04
            bazelisk: bazelisk-linux-amd64
            bazelisk_sha256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
          - platform: linux-arm64
            runner: ubuntu-26.04-arm
            bazelisk: bazelisk-linux-arm64
            bazelisk_sha256: e20e8b0f4f240091b7a55bf17b9398bd4f40ee70ae0208dff95dd4c445fb4010
          - platform: macos-amd64
            runner: macos-26-intel
            bazelisk: bazelisk-darwin-amd64
            bazelisk_sha256: 16c3d7aa15323a9fb69f56c7ec5733ed18bedb786680d0ba13bb12a3c8083007
          - platform: macos-arm64
            runner: macos-26
            bazelisk: bazelisk-darwin-arm64
            bazelisk_sha256: cee851f726789227d5561004e9904a52be45c3efb56f8b38b6993d6adbaa0409
          - platform: windows-amd64
            runner: windows-2025
            bazelisk: bazelisk-windows-amd64.exe
            bazelisk_sha256: 092a8738d5b41aae7a85c42cc961b1034e3389aba43ffc20c0fabda7b43e095b
            exe: .exe
    steps:
      # The checkout runs `git init`, which warns while no default branch
      # name is configured.
      - name: Configure git
        run: git config --global init.defaultBranch main

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          curl -fsSL -o "${bin}/bazel${{ matrix.exe }}" \
            "https://github.com/bazelbuild/bazelisk/releases/download/v${BAZELISK_VERSION}/${{ matrix.bazelisk }}"
          # By OS, not by what is on PATH: macOS ships a BSD `sha256sum`
          # that does not read a checksum list from stdin.
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            echo "${{ matrix.bazelisk_sha256 }}  ${bin}/bazel${{ matrix.exe }}" | shasum -a 256 -c
          else
            echo "${{ matrix.bazelisk_sha256 }}  ${bin}/bazel${{ matrix.exe }}" | sha256sum -c
          fi
          chmod +x "${bin}/bazel${{ matrix.exe }}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cygpath -w "${bin}" >> "${GITHUB_PATH}"
          else
            echo "${bin}" >> "${GITHUB_PATH}"
          fi

      # The Lance build and its caches need more than the free space of a
      # Linux runner. The image's toolchains this job does not use take
      # about as much.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          removed=(
            /opt/az
            /opt/ghc
            /opt/hostedtoolcache
            /opt/microsoft
            /opt/pipx
            /usr/lib/jvm
            /usr/local/.ghcup
            /usr/local/graalvm
            /usr/local/lib/android
            /usr/local/share/boost
            /usr/local/share/powershell
            /usr/share/codeql
            /usr/share/dotnet
            /usr/share/miniconda
            /usr/share/sbt
            /usr/share/swift
          )
          df -h /
          sudo rm -rf "${removed[@]}"
          df -h /
          # The image's variables that point into what is gone are emptied,
          # an empty value being none: rules_android, which protobuf
          # depends on, fails on the SDK of ANDROID_HOME, and Bazel warns
          # about the JDK of JAVA_HOME.
          for name in $(compgen -e); do
            for path in "${removed[@]}"; do
              if [[ "${!name}" == "${path}" || "${!name}" == "${path}/"* ]]; then
                echo "${name}=" >> "${GITHUB_ENV}"
                break
              fi
            done
          done

      # Bazel's C++ toolchain links Rust with lld when it finds one and
      # falls back to gold, which rustc warns is deprecated and buggy.
      # Ubuntu runners have gold and no lld.
      - name: Install lld
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld
          ld.lld --version

      - name: Configure Bazel for Windows
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          mkdir -p /d/b
          # Git for Windows bash, for Bazel's shell actions and sh_test.
          echo "BAZEL_SH=C:/Program Files/Git/bin/bash.exe" >> "${GITHUB_ENV}"
          {
            # The shortest output base: the build script of a crate runs in
            # a directory that names the crate's repository twice, and
            # cl.exe, which knows no long paths, joins a relative include to
            # it as it is written. zstd-sys's
            # `zstd\lib\dictBuilder\..\compress\zstd_compress_internal.h`
            # came to 257 characters before `.bazelrc` shortened the output
            # directory, two short of MAX_PATH; an output base of its own
            # hash directory (--output_user_root) adds 9. On D:, the
            # runner's local disk, not C:, its system disk: there every
            # flush waits, and a unit test of 400 writes took 56 s instead
            # of 3 s.
            echo "startup --output_base=D:/b"
            echo "startup --windows_enable_symlinks"
            echo "build --symlink_prefix=/"
          } >> "${HOME}/.bazelrc"

      # Test Vaults on a RAM disk, as `.bazelrc` puts them on tmpfs on
      # Linux: each write syncs its file, which on macOS is F_FULLFSYNC, and
      # the runner's disk takes long enough over those for the suites to
      # time out. The gate checks behaviour, not disk speed.
      - name: Put test files on a RAM disk
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # 2 GiB in 512-byte sectors.
          device="$(hdiutil attach -nomount ram://4194304 | tr -d '[:space:]')"
          diskutil erasevolume APFS scheda-tests "${device}"
          echo "test --test_tmpdir=/Volumes/scheda-tests/bazel-test" >> "${HOME}/.bazelrc"

      # The macOS and Windows runners take several times longer than Linux
      # over the volume suites (git, the file system), past the 300 s of a
      # small test: there each timeout is three times as long, so a run
      # reports which test failed and why, not a timeout. A Rust test
      # writes its output, the panic of a failed test included, as it
      # runs: libtest prints captured output only after the whole suite,
      # which a suite that still times out never reaches. And one test
      # binary runs at a time: each Rust suite runs its tests on threads of
      # its own, and the Lance ones start pools of their own. Four suites at
      # once on the four cores of windows-amd64 and macos-amd64 made a write
      # over a hundred times slower than alone (7 ms on Windows): 64 writes
      # queued on one handle outran the 60 s they may wait, and a test that
      # needs four writes within one second never got them.
      - name: Adjust the tests to the runner
        if: runner.os != 'Linux'
        run: |
          set -euo pipefail
          {
            echo "test --test_timeout=900,2700,8100,10800"
            echo "test --test_env=RUST_TEST_NOCAPTURE=1"
            echo "test --local_test_jobs=1"
          } >> "${HOME}/.bazelrc"

      - name: Configure Bazel caches
        run: |
          set -euo pipefail
          # Outside the checkout: Bazel 9 refuses a repository cache inside
          # the workspace.
          disk="${RUNNER_TEMP}/bazel-disk"
          repo="${RUNNER_TEMP}/bazel-repo"
          mkdir -p "${disk}" "${repo}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            disk="$(cygpath -m "${disk}")"
            repo="$(cygpath -m "${repo}")"
          fi
          {
            echo "common --disk_cache=${disk}"
            echo "common --repository_cache=${repo}"
          } >> "${HOME}/.bazelrc"

      - name: Restore Bazel caches
        id: bazel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/bazel-disk
            ${{ runner.temp }}/bazel-repo
          key: bazel-${{ matrix.platform }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'Cargo.lock') }}
          restore-keys: |
            bazel-${{ matrix.platform }}-

      - name: Bazel build
        # Git Bash on Windows rewrites an argument that starts with `//` and
        # has no other `/` as a Windows switch (`//rust:lint` -> `/rust:lint`).
        env:
          MSYS_NO_PATHCONV: "1"
        run: bazel build //... --keep_going

      # The tests are named as well as matched by //...: Bazel skips an
      # incompatible target of a pattern silently, but fails on a named
      # one, so a platform that cannot build them fails instead of passing
      # with nothing run.
      - name: Bazel test
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          tests=(
            //api:generate_test
            //api:lint
            //bazel:lint
            //bazel:markdown
            //rust:lint
            //rust:rustfmt
            //rust:vuln
            //rust/api:contract_test
            //rust/api:generated_v1_test
            //rust/api:git_terms_test
            //rust/api:version_field_test
            //rust/blocking:blocking_doc_test
            //rust/blocking:blocking_test
            //rust/cli:agent_test
            //rust/cli:cli_test
            //rust/cli:http_test
            //rust/scheda:integration_test
            //rust/scheda:integration_thin_test
            //rust/scheda:scheda_doc_test
            //rust/scheda:scheda_test
            //rust/scheda:scheda_thin_test
          )
          # `.bazelrc` deletes the Python packages on Windows.
          if [[ "${RUNNER_OS}" != "Windows" ]]; then
            tests+=(//python:lint //python:vuln)
          fi
          bazel test //... --keep_going --test_output=errors "${tests[@]}"

      # Stopped before the caches are saved, so nothing writes them then.
      - name: Stop Bazel
        if: always()
        continue-on-error: true
        run: bazel shutdown || true

      - name: Disk space
        if: always()
        run: df -h

      - name: Save Bazel caches
        if: github.ref == 'refs/heads/main' && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/bazel-disk
            ${{ runner.temp }}/bazel-repo
          key: bazel-${{ matrix.platform }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'Cargo.lock') }}

  # The Rust targets of the Bazel gate, as Cargo builds them: clippy and the
  # tests of the workspace with every feature, and of `scheda` with none.
  # The checks of the other files (buf, buildifier, markdownlint, ruff, the
  # audits) do not depend on the platform and run in the Bazel jobs.
  cargo:
    name: windows-arm64
    runs-on: windows-11-arm
    timeout-minutes: 240
    steps:
      - name: Configure git
        run: git config --global init.defaultBranch main

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Lance crates compile .proto files in their build scripts. The
      # protoc Bazel runs on this platform: protobuf publishes no Windows
      # ARM64 build, and Windows 11 on ARM runs the x64 one. Same release
      # and sha256 as bazel_utils_buf's pin.
      - name: Install protoc
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/protoc"
          curl -fsSL -o "${RUNNER_TEMP}/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-win64.zip"
          echo "f0c128dc0d8492eceece83bb459a4c0e316764b929ffbf1aa416357fd644edd3  ${RUNNER_TEMP}/protoc.zip" | sha256sum -c
          unzip -q -d "${dir}" "${RUNNER_TEMP}/protoc.zip"
          echo "PROTOC=$(cygpath -w "${dir}/bin/protoc.exe")" >> "${GITHUB_ENV}"

      # ring compiles its C and assembly with clang on Windows arm64.
      - name: Find clang
        run: |
          set -euo pipefail
          command -v clang
          clang --version

      - name: Install Rust
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null; then
            curl -fsSL -o "${RUNNER_TEMP}/rustup-init.exe" \
              "https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe"
            "${RUNNER_TEMP}/rustup-init.exe" -y --profile minimal --default-toolchain none
            cygpath -w "${USERPROFILE}/.cargo/bin" >> "${GITHUB_PATH}"
          fi

      # rust-toolchain.toml selects the toolchain; clippy is added to it.
      - name: Set up the toolchain
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup component add clippy
          rustc --version

      - name: Clippy
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets --all-features
          cargo clippy --locked -p scheda --all-targets --no-default-features

      # The library first; each step runs whatever the one before found.
      - name: Test the library
        # Bazel's test environment (`.bazelrc`): the runner's git
        # configuration must not change outcomes.
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: ""
          GIT_CONFIG_SYSTEM: ""
        run: |
          set -euo pipefail
          # Every test binary runs, whatever one before it found.
          cargo test --locked --no-fail-fast -p scheda -p scheda-api -p scheda-blocking --all-features

      - name: Test the library without features
        if: ${{ !cancelled() }}
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: ""
          GIT_CONFIG_SYSTEM: ""
        run: cargo test --locked --no-fail-fast -p scheda --no-default-features

      - name: Test the CLI
        if: ${{ !cancelled() }}
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: ""
          GIT_CONFIG_SYSTEM: ""
        run: cargo test --locked --no-fail-fast -p scheda-cli

      - name: Disk space
        if: always()
        run: df -h
