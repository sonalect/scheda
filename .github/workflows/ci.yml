name: CI

# Automatic CI is disabled. Restore push/pull_request to re-enable.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BAZELISK_VERSION: 1.29.0

jobs:
  linux:
    name: Bazel (Linux)
    runs-on: ubuntu-latest
    container:
      image: debian:13
      # Individual host toolchains, not `/`: a full-root mount can change
      # ownership of the runner disk.
      volumes:
        - /usr/local/lib/android:/mnt/drop/android
        - /usr/share/dotnet:/mnt/drop/dotnet
        - /opt/ghc:/mnt/drop/ghc
        - /usr/local/.ghcup:/mnt/drop/ghcup
        - /usr/share/swift:/mnt/drop/swift
        - /usr/local/share/powershell:/mnt/drop/powershell
        - /opt/hostedtoolcache:/mnt/drop/hostedtoolcache
        - /usr/lib/jvm:/mnt/drop/jvm
        - /opt/az:/mnt/drop/az
        - /usr/share/miniconda:/mnt/drop/miniconda
        - /usr/local/share/boost:/mnt/drop/boost
        - /opt/microsoft:/mnt/drop/microsoft
        - /usr/share/codeql:/mnt/drop/codeql
        - /usr/local/graalvm:/mnt/drop/graalvm
        - /usr/share/sbt:/mnt/drop/sbt
        - /opt/pipx:/mnt/drop/pipx
    timeout-minutes: 90
    env:
      BAZELISK_SHA256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
      # Portable caches only. Do not persist output_user_root (~/.cache/bazel):
      # it includes sandbox, execroot, and a live Bazel server.
      BAZEL_DISK_CACHE: /github/home/.cache/bazel-disk
      BAZEL_REPO_CACHE: /github/home/.cache/bazel-repo
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils \
            ca-certificates \
            cmake \
            curl \
            g++ \
            gcc \
            git \
            libc6-dev \
            libssl-dev \
            make \
            patch \
            pkg-config \
            zlib1g-dev

      - name: Install Bazelisk
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bazelisk \
            "https://github.com/bazelbuild/bazelisk/releases/download/v${BAZELISK_VERSION}/bazelisk-linux-amd64"
          echo "${BAZELISK_SHA256}  /tmp/bazelisk" | sha256sum -c
          install -m 0755 /tmp/bazelisk /usr/local/bin/bazel

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # ubuntu-latest guarantees 14 GB free. Restoring bazel-debian13-cas-*
      # (several GiB compressed) extracts on top of that and fills the disk.
      - name: Free host disk space
        run: bash .github/scripts/free-host-disk.sh

      - name: Cache Bazel
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ env.BAZEL_DISK_CACHE }}
            ${{ env.BAZEL_REPO_CACHE }}
          key: bazel-debian13-cas-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'Cargo.lock') }}
          restore-keys: |
            bazel-debian13-cas-

      - name: Configure Bazel caches
        run: |
          set -euo pipefail
          mkdir -p "${BAZEL_DISK_CACHE}" "${BAZEL_REPO_CACHE}"
          {
            echo "common --disk_cache=${BAZEL_DISK_CACHE}"
            echo "common --repository_cache=${BAZEL_REPO_CACHE}"
          } >> "${HOME}/.bazelrc"

      - name: Build
        run: bazel build //... --keep_going

      - name: Test
        run: bazel test //... --keep_going --test_output=all

      # Stop the server so repository/disk caches are idle before actions/cache tars them.
      # Unprivileged debian:13 containers often cannot reap the JVM after SIGKILL
      # (Bazel exit 36). That must not fail the job, or the cache post step is skipped.
      - name: Stop Bazel
        if: always()
        continue-on-error: true
        run: |
          set +e
          bazel shutdown
          for pidfile in "${HOME}"/.cache/bazel/_bazel_*/server/server.pid; do
            if [ -f "${pidfile}" ]; then
              kill -9 "$(cat "${pidfile}")" 2>/dev/null || true
            fi
          done
          exit 0

  macos:
    name: Bazel (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          set -euo pipefail
          brew install cmake openssl pkg-config
          prefix="$(brew --prefix openssl)"
          echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" >> "${GITHUB_ENV}"
          echo "OPENSSL_DIR=${prefix}" >> "${GITHUB_ENV}"

      - name: Install Bazelisk
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              artifact="bazelisk-darwin-arm64"
              sha256="cee851f726789227d5561004e9904a52be45c3efb56f8b38b6993d6adbaa0409"
              ;;
            x86_64)
              artifact="bazelisk-darwin-amd64"
              sha256="16c3d7aa15323a9fb69f56c7ec5733ed18bedb786680d0ba13bb12a3c8083007"
              ;;
            *)
              echo "unsupported macOS arch: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o /tmp/bazelisk \
            "https://github.com/bazelbuild/bazelisk/releases/download/v${BAZELISK_VERSION}/${artifact}"
          echo "${sha256}  /tmp/bazelisk" | shasum -a 256 -c
          sudo install -m 0755 /tmp/bazelisk /usr/local/bin/bazel

      # runner.temp is invalid in jobs.<id>.env (evaluated before a runner is
      # assigned). It is valid in steps.with / $RUNNER_TEMP. Paths must stay
      # outside the checkout: Bazel 9 refuses --repository_cache inside the repo.
      - name: Cache Bazel
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ runner.temp }}/bazel-disk
            ${{ runner.temp }}/bazel-repo
          key: bazel-macos-cas-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'Cargo.lock') }}
          restore-keys: |
            bazel-macos-cas-

      - name: Configure Bazel caches
        run: |
          set -euo pipefail
          disk="${RUNNER_TEMP}/bazel-disk"
          repo="${RUNNER_TEMP}/bazel-repo"
          mkdir -p "${disk}" "${repo}"
          {
            echo "common --disk_cache=${disk}"
            echo "common --repository_cache=${repo}"
          } >> "${HOME}/.bazelrc"

      # python/cli and python/vllm are `--deleted_packages` in `.bazelrc`
      # (uv.lock is Linux-only; sdist of hf_xet / PyYAML has no `build`).
      - name: Build
        run: bazel build //... --keep_going

      - name: Test
        run: bazel test //... --keep_going --test_output=all

      - name: Stop Bazel
        if: always()
        continue-on-error: true
        run: |
          set +e
          bazel shutdown
          exit 0

  windows:
    name: Bazel (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Git for Windows bash. Native sh_test / run_shell look this up;
      # bazel_utils `.bash` test rules still cannot CreateProcess those
      # scripts (they are target_compatible_with Windows-incompatible).
      # Python packages are `--deleted_packages` in `.bazelrc` on Windows
      # so `//...` does not load python/ BUILD files. uv host still runs
      # via python.MODULE.bazel; patched to stub msvc instead of fail().
      BAZEL_SH: C:/Program Files/Git/bin/bash.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # HTTPS uses WinHTTP; SSH uses vendored libssh2 + WinCNG. CMake is on the
      # image for vendored libgit2. Git usr/bin supplies patch.exe.
      - name: Install Bazelisk
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/bazelisk.exe" \
            "https://github.com/bazelbuild/bazelisk/releases/download/v${BAZELISK_VERSION}/bazelisk-windows-amd64.exe"
          echo "092a8738d5b41aae7a85c42cc961b1034e3389aba43ffc20c0fabda7b43e095b  ${RUNNER_TEMP}/bazelisk.exe" | sha256sum -c
          mkdir -p "${RUNNER_TEMP}/bin"
          cp "${RUNNER_TEMP}/bazelisk.exe" "${RUNNER_TEMP}/bin/bazel.exe"
          echo "$(cygpath -w "${RUNNER_TEMP}/bin")" >> "${GITHUB_PATH}"
          echo "$(cygpath -w "/c/Program Files/Git/usr/bin")" >> "${GITHUB_PATH}"

      - name: Cache Bazel
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ runner.temp }}/bazel-disk
            ${{ runner.temp }}/bazel-repo
          key: bazel-windows-amd64-cas-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'Cargo.lock') }}
          restore-keys: |
            bazel-windows-amd64-cas-

      - name: Configure Bazel caches
        shell: bash
        run: |
          set -euo pipefail
          disk="$(cygpath -m "${RUNNER_TEMP}/bazel-disk")"
          repo="$(cygpath -m "${RUNNER_TEMP}/bazel-repo")"
          mkdir -p "${RUNNER_TEMP}/bazel-disk" "${RUNNER_TEMP}/bazel-repo" /c/b
          {
            # Short root: CARGO_MANIFEST_DIR repeats the bzlmod repo name and
            # hits MAX_PATH (CreateProcess 267) under D:\a\_temp\bzl\...
            echo "startup --output_user_root=C:/b"
            echo "startup --windows_enable_symlinks"
            echo "build --symlink_prefix=/"
            echo "common --disk_cache=${disk}"
            echo "common --repository_cache=${repo}"
          } >> "${HOME}/.bazelrc"

      - name: Build
        run: bazel build //... --keep_going

      - name: Test
        run: bazel test //... --keep_going --test_output=all

      - name: Stop Bazel
        if: always()
        continue-on-error: true
        run: |
          bazel shutdown
          exit 0
