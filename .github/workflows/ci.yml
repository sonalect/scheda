name: CI

# The full `bazel build //...` and `bazel test //...` on six platforms:
# Linux, macOS, and Windows, each on amd64 and arm64.
#
# Automatic CI is disabled: a manual run (workflow_dispatch) on any branch.
# Restore push/pull_request to re-enable.
#
# Bazel caches: only --disk_cache and --repository_cache (never the output
# root, which holds a live server). A run may restore caches of its own ref
# or of the default branch, so only a run on main saves them, and a run on
# another branch starts from main's.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BAZELISK_VERSION: 1.29.0

defaults:
  run:
    shell: bash

jobs:
  platform:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-26.04
            bazelisk: bazelisk-linux-amd64
            bazelisk_sha256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
          - platform: linux-arm64
            runner: ubuntu-26.04-arm
            bazelisk: bazelisk-linux-arm64
            bazelisk_sha256: e20e8b0f4f240091b7a55bf17b9398bd4f40ee70ae0208dff95dd4c445fb4010
          - platform: macos-amd64
            runner: macos-26-intel
            bazelisk: bazelisk-darwin-amd64
            bazelisk_sha256: 16c3d7aa15323a9fb69f56c7ec5733ed18bedb786680d0ba13bb12a3c8083007
          - platform: macos-arm64
            runner: macos-26
            bazelisk: bazelisk-darwin-arm64
            bazelisk_sha256: cee851f726789227d5561004e9904a52be45c3efb56f8b38b6993d6adbaa0409
          - platform: windows-amd64
            runner: windows-2025
            bazelisk: bazelisk-windows-amd64.exe
            bazelisk_sha256: 092a8738d5b41aae7a85c42cc961b1034e3389aba43ffc20c0fabda7b43e095b
            exe: .exe
          - platform: windows-arm64
            runner: windows-11-arm
            bazelisk: bazelisk-windows-arm64.exe
            bazelisk_sha256: 8bc42bd5d7857f18a21440b906469bb6c7cf91a7c72364d4b1e5ec56a76fe94f
            exe: .exe
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          curl -fsSL -o "${bin}/bazel${{ matrix.exe }}" \
            "https://github.com/bazelbuild/bazelisk/releases/download/v${BAZELISK_VERSION}/${{ matrix.bazelisk }}"
          # By OS, not by what is on PATH: macOS ships a BSD `sha256sum`
          # that does not read a checksum list from stdin.
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            echo "${{ matrix.bazelisk_sha256 }}  ${bin}/bazel${{ matrix.exe }}" | shasum -a 256 -c
          else
            echo "${{ matrix.bazelisk_sha256 }}  ${bin}/bazel${{ matrix.exe }}" | sha256sum -c
          fi
          chmod +x "${bin}/bazel${{ matrix.exe }}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cygpath -w "${bin}" >> "${GITHUB_PATH}"
          else
            echo "${bin}" >> "${GITHUB_PATH}"
          fi

      # The Lance build and its caches need more than the free space of a
      # Linux runner. The image's toolchains this job does not use take
      # about as much.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /opt/az \
            /opt/ghc \
            /opt/hostedtoolcache \
            /opt/microsoft \
            /opt/pipx \
            /usr/lib/jvm \
            /usr/local/.ghcup \
            /usr/local/graalvm \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/codeql \
            /usr/share/dotnet \
            /usr/share/miniconda \
            /usr/share/sbt \
            /usr/share/swift
          df -h /
          # The image points these at the Android SDK and NDK removed
          # above. rules_android, which protobuf depends on, reads
          # ANDROID_HOME and fails on an SDK that is not there; an empty
          # value is no SDK.
          for var in ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK ANDROID_NDK_HOME \
            ANDROID_NDK_LATEST_HOME ANDROID_NDK_ROOT; do
            echo "${var}=" >> "${GITHUB_ENV}"
          done

      # Bazel's C++ toolchain links Rust with lld when it finds one and
      # falls back to gold, which rustc warns is deprecated and buggy.
      # Ubuntu runners have gold and no lld.
      - name: Install lld
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld
          ld.lld --version

      - name: Configure Bazel for Windows
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          mkdir -p /c/b
          # Git for Windows bash, for Bazel's shell actions and sh_test.
          echo "BAZEL_SH=C:/Program Files/Git/bin/bash.exe" >> "${GITHUB_ENV}"
          {
            # Short output root: CARGO_MANIFEST_DIR repeats the bzlmod
            # repository name and hits MAX_PATH (CreateProcess 267) under
            # the runner's work directory.
            echo "startup --output_user_root=C:/b"
            echo "startup --windows_enable_symlinks"
            echo "build --symlink_prefix=/"
          } >> "${HOME}/.bazelrc"

      - name: Configure Bazel caches
        run: |
          set -euo pipefail
          # Outside the checkout: Bazel 9 refuses a repository cache inside
          # the workspace.
          disk="${RUNNER_TEMP}/bazel-disk"
          repo="${RUNNER_TEMP}/bazel-repo"
          mkdir -p "${disk}" "${repo}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            disk="$(cygpath -m "${disk}")"
            repo="$(cygpath -m "${repo}")"
          fi
          {
            echo "common --disk_cache=${disk}"
            echo "common --repository_cache=${repo}"
          } >> "${HOME}/.bazelrc"

      - name: Restore Bazel caches
        id: bazel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/bazel-disk
            ${{ runner.temp }}/bazel-repo
          key: bazel-${{ matrix.platform }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'Cargo.lock') }}
          restore-keys: |
            bazel-${{ matrix.platform }}-

      - name: Bazel build
        # Git Bash on Windows rewrites an argument that starts with `//` and
        # has no other `/` as a Windows switch (`//rust:lint` -> `/rust:lint`).
        env:
          MSYS_NO_PATHCONV: "1"
        run: bazel build //... --keep_going

      # The tests are named as well as matched by //...: Bazel skips an
      # incompatible target of a pattern silently, but fails on a named
      # one, so a platform that cannot build them fails instead of passing
      # with nothing run.
      - name: Bazel test
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          tests=(
            //api:generate_test
            //api:lint
            //bazel:lint
            //bazel:markdown
            //rust:lint
            //rust:rustfmt
            //rust:vuln
            //rust/api:contract_test
            //rust/api:generated_v1_test
            //rust/api:git_terms_test
            //rust/api:version_field_test
            //rust/blocking:blocking_doc_test
            //rust/blocking:blocking_test
            //rust/cli:agent_test
            //rust/cli:cli_test
            //rust/cli:http_test
            //rust/scheda:integration_test
            //rust/scheda:integration_thin_test
            //rust/scheda:scheda_doc_test
            //rust/scheda:scheda_test
            //rust/scheda:scheda_thin_test
          )
          # `.bazelrc` deletes the Python packages on Windows.
          if [[ "${RUNNER_OS}" != "Windows" ]]; then
            tests+=(//python:lint //python:vuln)
          fi
          bazel test //... --keep_going --test_output=errors "${tests[@]}"

      # Stopped before the caches are saved, so nothing writes them then.
      - name: Stop Bazel
        if: always()
        continue-on-error: true
        run: bazel shutdown || true

      - name: Disk space
        if: always()
        run: df -h

      - name: Save Bazel caches
        if: github.ref == 'refs/heads/main' && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/bazel-disk
            ${{ runner.temp }}/bazel-repo
          key: bazel-${{ matrix.platform }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'Cargo.lock') }}
