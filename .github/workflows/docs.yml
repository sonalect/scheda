# Publish rustdoc HTML to GitHub Pages (no crates.io).
# Repo Settings → Pages → Source: GitHub Actions.

name: Docs

# Automatic Docs workflow is disabled. Restore push to main to re-enable.
on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: rustdoc
    runs-on: ubuntu-latest
    container:
      image: debian:13
      # Individual host toolchains, not `/`: a full-root mount can change
      # ownership of the runner disk.
      volumes:
        - /usr/local/lib/android:/mnt/drop/android
        - /usr/share/dotnet:/mnt/drop/dotnet
        - /opt/ghc:/mnt/drop/ghc
        - /usr/local/.ghcup:/mnt/drop/ghcup
        - /usr/share/swift:/mnt/drop/swift
        - /usr/local/share/powershell:/mnt/drop/powershell
        - /opt/hostedtoolcache:/mnt/drop/hostedtoolcache
        - /usr/lib/jvm:/mnt/drop/jvm
        - /opt/az:/mnt/drop/az
        - /usr/share/miniconda:/mnt/drop/miniconda
        - /usr/local/share/boost:/mnt/drop/boost
        - /opt/microsoft:/mnt/drop/microsoft
        - /usr/share/codeql:/mnt/drop/codeql
        - /usr/local/graalvm:/mnt/drop/graalvm
        - /usr/share/sbt:/mnt/drop/sbt
        - /opt/pipx:/mnt/drop/pipx
    timeout-minutes: 90
    env:
      BAZELISK_VERSION: 1.29.0
      BAZELISK_SHA256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
      BAZEL_DISK_CACHE: /github/home/.cache/bazel-disk
      BAZEL_REPO_CACHE: /github/home/.cache/bazel-repo
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils \
            ca-certificates \
            cmake \
            curl \
            g++ \
            gcc \
            git \
            libc6-dev \
            libssl-dev \
            make \
            patch \
            pkg-config \
            zlib1g-dev

      - name: Install Bazelisk
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bazelisk \
            "https://github.com/bazelbuild/bazelisk/releases/download/v${BAZELISK_VERSION}/bazelisk-linux-amd64"
          echo "${BAZELISK_SHA256}  /tmp/bazelisk" | sha256sum -c
          install -m 0755 /tmp/bazelisk /usr/local/bin/bazel

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest guarantees 14 GB free. Restoring bazel-debian13-cas-*
      # (several GiB compressed) extracts on top of that and fills the disk.
      - name: Free host disk space
        run: bash .github/scripts/free-host-disk.sh

      - name: Restore Bazel cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.BAZEL_DISK_CACHE }}
            ${{ env.BAZEL_REPO_CACHE }}
          key: bazel-debian13-cas-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'Cargo.lock') }}
          restore-keys: |
            bazel-debian13-cas-

      - name: Configure Bazel caches
        run: |
          set -euo pipefail
          mkdir -p "${BAZEL_DISK_CACHE}" "${BAZEL_REPO_CACHE}"
          {
            echo "common --disk_cache=${BAZEL_DISK_CACHE}"
            echo "common --repository_cache=${BAZEL_REPO_CACHE}"
          } >> "${HOME}/.bazelrc"

      - name: Build Pages site
        run: |
          set -euo pipefail
          bazel build //rust/scheda:pages
          site="${RUNNER_TEMP}/pages"
          mkdir -p "${site}"
          cp -R -L "$(bazel info bazel-bin)/rust/scheda/pages/." "${site}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages
          include-hidden-files: true

  deploy:
    name: GitHub Pages
    needs: build
    # Private repos without Pages enabled fail deploy with 404. rustdoc still
    # built and uploaded; turn Pages on (Settings → Pages → GitHub Actions)
    # to publish.
    if: github.event.repository.has_pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
