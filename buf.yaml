# Buf config of the contract (Buf LSP, lint, and the generate). The
# contract sits under `api/` at the path its package names. Bazel stages
# the protos the contract imports (protovalidate, protobuf, and the
# protocontract options) at their import paths from the root; the second
# module makes them visible, and lint skips them.
version: v2
modules:
  - path: api
  - path: .
    includes:
      - buf
      - google
      - protocontract
lint:
  use:
    - STANDARD
  except:
    # A contract that stays in one process is named as its Rust code reads,
    # not as an RPC API: the service as its trait, the methods over the
    # domain's own messages.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - SERVICE_SUFFIX
  ignore:
    - buf
    - google
    - protocontract
