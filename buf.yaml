# Workspace buf config. Generate/lint copy this file; BSR deps stay remote.
version: v2
modules:
  - path: .
    includes:
      - api
deps:
  - buf.build/bufbuild/protovalidate:v1.2.2
  - buf.build/protocolbuffers/wellknowntypes:v36.2
lint:
  use:
    - STANDARD
  ignore_only:
    PACKAGE_VERSION_SUFFIX:
      # Package `api` matches `api/version.proto` (PACKAGE_DIRECTORY_MATCH).
      - api/version.proto
breaking:
  use:
    - FILE
