name: west_indexed
kind: document
schema_version: 1
layout: west/{id}.md
body:
  fts: true
  vector: true
fields:
  - name: title
    type: string
    fts: true
    vector: true
  - name: tag
    type: string
    filter: true
  - name: rank
    type: integer
    default: 0
  - name: see
    type: string
    edge:
      collection: west_docs
      multiplicity: one
      dangling: strict
