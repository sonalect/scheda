[package]
name = "scheda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Git-backed document store: text files as truth, derived index, library API"
readme = "../../README.md"
documentation = "https://amsokol.github.io/scheda/scheda/"

[features]
# Tantivy `find` (lexical Index). `search` pulls this in.
find = ["dep:tantivy"]
# Hybrid `search` (BM25 + USearch). Turns `find` on; the reverse does not.
search = ["find", "dep:usearch", "dep:cxx", "dep:sha1"]
# USearch SIMD kernels (`usearch/numkong`). Pulls `search` in.
simd = ["search", "usearch/numkong"]
# USearch OpenMP executor. Needs libomp (Linux `libomp-dev`; not used by Bazel CI).
openmp = ["search", "usearch/openmp"]
# Age ASCII-armor Record files. Off by default: a consumer that encrypts
# nothing does not compile scrypt / ChaCha20-Poly1305 / X25519.
encrypt = ["dep:age"]

[dependencies]
age = { workspace = true, optional = true }
cxx = { workspace = true, optional = true }
regex = { workspace = true }
scheda-generated = { workspace = true }
buffa = { workspace = true }
buffa-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true }
tantivy = { workspace = true, optional = true }
usearch = { workspace = true, optional = true }
yaml_serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

# Integration tests that call `find` / `search` need those methods compiled.
[[test]]
name = "ann"
required-features = ["search"]

[[test]]
name = "catalog"
required-features = ["search"]

[[test]]
name = "encrypt"
required-features = ["encrypt"]

[[test]]
name = "consumer"

[[test]]
name = "core"
required-features = ["find"]

[[test]]
name = "isolated"
required-features = ["find"]

[[test]]
name = "journal"
required-features = ["find"]

[[test]]
name = "ops"
required-features = ["search"]

[[test]]
name = "query"
required-features = ["find"]

[[test]]
name = "search"
required-features = ["search"]

[[test]]
name = "reindex"
required-features = ["search"]
