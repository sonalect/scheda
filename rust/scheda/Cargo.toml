[package]
name = "scheda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Git-backed document store: text files as truth, derived index, library API"
readme = "../../README.md"
documentation = "https://sonalect.github.io/scheda/scheda/"

[features]
# `index` builds the Index of a Vault on Lance: its queries, counts, and
# searches, and the ports (Projector, embedder, reranker). Without it those
# calls are `UNIMPLEMENTED`. Needs `protoc` to build (see
# `.claude/rules/run-commands.md`).
default = ["index"]
index = [
    "dep:futures-util",
    "dep:lance",
    "dep:lance-index",
    "dep:lance-linalg",
    "tokio/rt-multi-thread",
]
# Age ASCII-armor Record files. Off by default: a consumer that encrypts
# nothing does not compile scrypt / ChaCha20-Poly1305 / X25519.
encrypt = ["dep:age"]

[dependencies]
age = { workspace = true, optional = true }
buffa = { workspace = true }
buffa-types = { workspace = true }
futures-util = { workspace = true, optional = true }
git2 = { workspace = true }
lance = { workspace = true, optional = true }
lance-index = { workspace = true, optional = true }
lance-linalg = { workspace = true, optional = true }
libgit2-sys = { workspace = true }
libz-sys = { workspace = true }
protocontract = { workspace = true }
protovalidate-buffa = { workspace = true }
regex = { workspace = true }
scheda-api = { workspace = true }
scheda-blocking = { workspace = true }
serde = { workspace = true }
serde_ignored = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
yaml_serde = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
