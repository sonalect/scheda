[package]
name = "scheda-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin CLI encoding of the Scheda library API"
publish = false

[[bin]]
name = "scheda"
path = "src/main.rs"

[dependencies]
# Not used in code: makes `@scheda_cargo//:age` a hub alias for scheda `encrypt`.
age = { workspace = true }
buffa-types = { workspace = true }
clap = { workspace = true }
mimalloc = { workspace = true }
protocontract = { workspace = true }
scheda = { workspace = true, features = ["encrypt"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
ureq = { workspace = true }

[lints]
workspace = true
