[package]
name = "scheda-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin CLI encoding of the Scheda library API"
publish = false

[[bin]]
name = "scheda"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
mimalloc = { workspace = true }
model2vec-rs = { workspace = true }
scheda = { workspace = true, features = ["find", "search", "simd", "encrypt"] }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }

[lints]
workspace = true
