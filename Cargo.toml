[workspace]
resolver = "3"
members = ["rust/generated", "rust/scheda"]
exclude = [
    "third_party/buf/plugins/protoc-gen-buffa-packaging",
    "third_party/buf/plugins/protoc-gen-protovalidate-buffa",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
license = "Apache-2.0"
repository = "https://github.com/amsokol/scheda"
version = "0.0.1"

[workspace.dependencies]
scheda = { path = "rust/scheda" }
scheda-generated = { path = "rust/generated" }
buffa = { version = "=0.9.1", features = ["json"] }
buffa-types = { version = "=0.9.1", default-features = false, features = [
    "std",
    "json",
] }
git2 = { version = "=0.21.0", default-features = false, features = [
    "vendored-libgit2",
] }
protovalidate-buffa = { version = "=0.6.0", default-features = false }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
# SIMD via scheda feature `numkong`; lockfile pins 7.8.0 (7.8.1 is too new).
usearch = { version = "=2.26.0", default-features = false }
serde_json = "=1.0.151"
yaml_serde = "=0.10.7"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
