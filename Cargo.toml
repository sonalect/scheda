[workspace]
resolver = "3"
members = ["rust/cli", "rust/generated", "rust/scheda"]
exclude = [
    "third_party/buf/plugins/protoc-gen-buffa-packaging",
    "third_party/buf/plugins/protoc-gen-protovalidate-buffa",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/amsokol/scheda"
version = "0.9.12"

[workspace.dependencies]
age = { version = "=0.12.1", default-features = false, features = ["armor"] }
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", default-features = false, features = [
    "json",
    "std",
] }
clap = { version = "=4.6.6", features = ["derive"] }
cxx = "=1.0.200"
git2 = { version = "=0.21.0", default-features = false, features = [
    "vendored-libgit2",
] }
mimalloc = { git = "https://github.com/amsokol/mimalloc", tag = "v3.5.1", features = [
    "override",
] }
model2vec-rs = { version = "=0.2.1", default-features = false, features = [
    "fancy-regex",
    "local-only",
] }
protovalidate-buffa = { version = "=0.7.1", default-features = false }
regex = "=1.13.1"
scheda = { path = "rust/scheda" }
scheda-generated = { path = "rust/generated" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ureq = { version = "=3.4.0", features = ["json"] }
tantivy = "=0.26.1"
usearch = { version = "=2.26.2", default-features = false }
yaml_serde = "=0.10.7"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

# Cargo `--release` only. Bazel rustc flags are unchanged.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
