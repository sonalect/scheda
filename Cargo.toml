[workspace]
resolver = "3"
members = ["rust/api", "rust/cli", "rust/scheda"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/amsokol/scheda"
version = "0.21.0"

[workspace.dependencies]
age = { version = "=0.12.1", default-features = false, features = ["armor"] }
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", default-features = false, features = [
    "json",
    "std",
] }
clap = { version = "=4.6.7", features = ["derive"] }
cxx = "=1.0.205"
git2 = { version = "=0.21.0", default-features = false, features = [
    "vendored-libgit2",
] }
libgit2-sys = "=0.18.8"
mimalloc = { git = "https://github.com/amsokol/mimalloc", tag = "v3.5.3", features = [
    "override",
] }
model2vec-rs = { version = "=0.3.0", default-features = false, features = [
    "fancy-regex",
    "local-only",
] }
protocontract = "=0.4.0"
protovalidate-buffa = { version = "=0.7.2", default-features = false }
regex = "=1.13.1"
scheda = { path = "rust/scheda" }
scheda-api = { path = "rust/api" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_ignored = "=0.1.14"
serde_json = "=1.0.154"
sha1 = "=0.11.0"
sha2 = "=0.11.1"
ureq = { version = "=3.4.2", features = ["json"] }
tantivy = "=0.26.2"
tokio = { version = "=1.53.3", default-features = false }
usearch = { version = "=2.26.4", default-features = false }
yaml_serde = "=0.10.7"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[patch.crates-io]
cxx = { git = "https://github.com/sonalect/cxx", tag = "1.0.205-bazel-sandbox-fix" }
cxx-build = { git = "https://github.com/sonalect/cxx", tag = "1.0.205-bazel-sandbox-fix" }
numkong = { git = "https://github.com/sonalect/NumKong", tag = "v7.8.5-bazel-sandbox-fix" }
usearch = { git = "https://github.com/sonalect/USearch", tag = "v2.26.4-bazel-sandbox-fix" }

# Cargo `--release` only. Bazel rustc flags are unchanged.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
