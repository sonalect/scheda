[workspace]
resolver = "3"
members = ["rust/cli", "rust/generated", "rust/scheda"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/amsokol/scheda"
version = "0.17.0"

[workspace.dependencies]
age = { version = "=0.12.1", default-features = false, features = ["armor"] }
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", default-features = false, features = [
    "json",
    "std",
] }
clap = { version = "=4.6.7", features = ["derive"] }
cxx = "=1.0.202"
mimalloc = { git = "https://github.com/amsokol/mimalloc", tag = "v3.5.3", features = [
    "override",
] }
model2vec-rs = { version = "=0.2.1", default-features = false, features = [
    "fancy-regex",
    "local-only",
] }
protovalidate-buffa = { version = "=0.7.2", default-features = false }
regex = "=1.13.1"
scheda = { path = "rust/scheda" }
scheda-generated = { path = "rust/generated" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha1 = "=0.11.0"
sha2 = "=0.11.0"
ureq = { version = "=3.4.2", features = ["json"] }
tantivy = "=0.26.2"
usearch = { version = "=2.26.2", default-features = false }
yaml_serde = "=0.10.7"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[patch.crates-io]
cxx = { git = "https://github.com/amsokol/cxx", tag = "1.0.202-bazel-sandbox-fix-2" }
cxx-build = { git = "https://github.com/amsokol/cxx", tag = "1.0.202-bazel-sandbox-fix-2" }
numkong = { git = "https://github.com/amsokol/NumKong", tag = "v7.8.2-bazel-sandbox-fix" }
usearch = { git = "https://github.com/amsokol/USearch", tag = "v2.26.2-bazel-sandbox-fix" }

# Cargo `--release` only. Bazel rustc flags are unchanged.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
